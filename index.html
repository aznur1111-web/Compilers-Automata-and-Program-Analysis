 steps:["Parse the regex into a syntax tree.","Build an NFA (Thompson construction).","Convert the NFA to a DFA (subset construction).","Minimize the DFA.","Match the input."],
 pseudo:"Regex syntax:\n  literal a\n  concatenation ab\n  alternation a|b\n  Kleene star a*\n  optional a?\n  plus a+\n\nAlgebraic laws:\n  a|b = b|a\n  a(bc) = (ab)c\n  a(b|c) = ab|ac\n  (a*)* = a*\n  a** = a*\n  a? = a|epsilon\n  a+ = aa*\n\nRegular languages are closed under:\n  union, concatenation, star, complement, intersection\n\nPumping lemma:\n  L = {a^n b^n} is not regular",
 invariant:"Finite-state machines have no memory beyond the current state. They cannot count.",
 uses:"Lexing, grep, regex libraries, network protocol state machines, text processing.",
 strength:"Simple, fast (O(n) matching), well-understood math.",
 limits:"Cannot handle nested or recursive structure (e.g. balanced parentheses).",
 pitfall:"Backreferences (\\1) go beyond regular languages. Regex engines that support them use backtracking, not FSMs.",
 question:"Is the language of balanced parentheses regular?",
 answer:"No. It requires unbounded counting, which an FSM cannot do. A pushdown automaton is needed.",
 demo:"regex-fsm",sample:"a(b|c)*d\nabd",refs:[
  ["Kleene, Representation of events in nerve nets and finite automata, 1956","https://doi.org/10.1515/9781400882618-002"],
  ["Hopcroft, Motwani, Ullman, Introduction to Automata Theory, Languages, and Computation, 3rd ed., Pearson 2006","https://www.pearson.com/en-us/subject-catalog/p/introduction-to-automata-theory-languages-and-computation/P200000003409"],
  ["Sipser, Introduction to the Theory of Computation, 3rd ed., Cengage 2012","https://www.cengage.com/c/introduction-to-the-theory-of-computation-3e-sipser/9781133187790/"]]},
/* ================= 2 Lexing and parsing ================= */
{id:"thompson",title:"Thompson construction: regex to NFA",level:4,kind:"Automata",status:"Runnable teaching lab",
 summary:"Thompson construction turns a regular expression into an NFA with epsilon transitions. Each operator (concatenation, alternation, star) has a small recursive template.",
 mental:"Build small NFAs and glue them with epsilon edges",
 mentalText:"Literal: two states with an edge labeled by the character. Concatenation: connect the accept of one to the start of the next. Alternation: a new start with epsilon edges to both. Star: a loop with epsilon.",
 steps:["Parse the regex into a syntax tree.","Recursively build an NFA fragment for each node.","Concatenation: chain the fragments.","Alternation: new start and accept with epsilon edges.","Star: new start and accept with epsilon edges and a loop."],
 pseudo:"Fragment: (start_state, accept_state, transitions)\n\nLiteral a:\n  start --a--> accept\n\nConcatenation ab:\n  frag(a).accept --epsilon--> frag(b).start\n  start = frag(a).start, accept = frag(b).accept\n\nAlternation a|b:\n  new_start --epsilon--> frag(a).start\n  new_start --epsilon--> frag(b).start\n  frag(a).accept --epsilon--> new_accept\n  frag(b).accept --epsilon--> new_accept\n\nKleene star a*:\n  new_start --epsilon--> frag(a).start\n  new_start --epsilon--> new_accept\n  frag(a).accept --epsilon--> frag(a).start\n  frag(a).accept --epsilon--> new_accept\n\nThompson NFA has at most 2|r| states.\nMatching is O(n * |r|).",
 invariant:"The NFA accepts exactly the language of the regex. Epsilon transitions preserve the language.",
 uses:"Lexer generators (lex, flex), regex engines, automata theory.",
 strength:"Systematic, provably correct, linear-size construction.",
 limits:"NFAs have many epsilon transitions and are slower to simulate than DFAs.",
 pitfall:"Forgetting to add the epsilon transition for the empty alternative (a|) gives a wrong language.",
 question:"How many states does the Thompson NFA have for a regex of length n?",
 answer:"At most 2n states. Each character adds two states, and each operator adds two more.",
 demo:"regex-nfa",sample:"a(b|c)*d",refs:[
  ["Thompson, Programming techniques: Regular expression search algorithm, CACM 1968","https://doi.org/10.1145/363347.363387"],
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 3","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Hopcroft et al., Introduction to Automata Theory, Ch. 3","https://www.pearson.com/en-us/subject-catalog/p/introduction-to-automata-theory-languages-and-computation/P200000003409"]]},
{id:"subset-construction",title:"Subset construction: NFA to DFA",level:4,kind:"Automata",status:"Runnable teaching lab",
 summary:"Subset construction converts an NFA into a DFA whose states are sets of NFA states. The DFA accepts the same language and can be simulated in O(1) per input symbol.",
 mental:"Each DFA state is a set of NFA states you could be in",
 mentalText:"Start with the epsilon closure of the NFA start. For each DFA state and each alphabet symbol, compute the epsilon closure of the NFA states reachable. Repeat until no new states.",
 steps:["Compute the epsilon closure of the NFA start.","For each DFA state and each symbol, compute the move and its epsilon closure.","Add the new state to the queue.","Mark DFA states containing an NFA accept state as accepting."],
 pseudo:"epsilon_closure(S):\n  result = S\n  stack = list(S)\n  while stack:\n    s = stack.pop()\n    for each epsilon transition s -> t:\n      if t not in result:\n        result.add(t)\n        stack.append(t)\n  return result\n\nsubset_construction(nfa):\n  start = epsilon_closure({nfa.start})\n  D = {start: new_dfa_state()}\n  queue = [start]\n  while queue:\n    S = queue.pop()\n    for each symbol a in alphabet:\n      T = epsilon_closure(move(S, a))\n      if T not in D:\n        D[T] = new_dfa_state()\n        queue.append(T)\n      add transition D[S] --a--> D[T]\n  accepting = {D[S] : S contains an NFA accept state}\n  return D\n\nWorst case: 2^n DFA states.\nIn practice: much fewer.",
 invariant:"The DFA accepts exactly the language of the NFA. Subset construction is exact.",
 uses:"Lexer generation, regex to DFA conversion, automata theory.",
 strength:"Produces a fast DFA from any NFA. Deterministic simulation.",
 limits:"Worst-case exponential blowup. Some languages need exponentially many DFA states.",
 pitfall:"Forgetting the epsilon closure gives a DFA that misses transitions.",
 question:"What is the worst-case blowup of subset construction?",
 answer:"2^n DFA states for an n-state NFA. The language (a|b)*a(a|b)^n needs 2^n DFA states.",
 demo:"subset-construction",sample:"a(b|c)*d",refs:[
  ["Rabin and Scott, Finite automata and their decision problems, IBM J. Research 1959","https://doi.org/10.1147/rd.32.0114"],
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 3","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Hopcroft et al., Introduction to Automata Theory, Ch. 3","https://www.pearson.com/en-us/subject-catalog/p/introduction-to-automata-theory-languages-and-computation/P200000003409"]]},
{id:"recursive-descent",title:"Recursive descent and LL(1) parsing",level:4,kind:"Parsing",status:"Runnable teaching lab",
 summary:"Recursive descent parses a grammar by writing one function per nonterminal. LL(1) uses one lookahead token to choose the production. The parser is simple, fast and easy to debug.",
 mental:"One function per nonterminal, one lookahead token",
 mentalText:"For expression grammar E -> T E', E' -> + T E' | epsilon, write parseE() and parseEPrime(). Each function matches the current token and recurses.",
 steps:["Eliminate left recursion.","Left-factor the grammar.","Compute the FIRST and FOLLOW sets.","Build the LL(1) parsing table.","Write recursive descent functions or use the table."],
 pseudo:"Expression grammar (left-recursive):\n  E -> E + T | T\n  T -> T * F | F\n  F -> ( E ) | id\n\nAfter eliminating left recursion:\n  E  -> T E'\n  E' -> + T E' | epsilon\n  T  -> F T'\n  T' -> * F T' | epsilon\n  F  -> ( E ) | id\n\nFIRST sets:\n  FIRST(E)  = { (, id }\n  FIRST(E') = { +, epsilon }\n  FIRST(T)  = { (, id }\n  FIRST(T') = { *, epsilon }\n  FIRST(F)  = { (, id }\n\nFOLLOW sets:\n  FOLLOW(E)  = { ), $ }\n  FOLLOW(E') = FOLLOW(E)\n  FOLLOW(T)  = { +, ), $ }\n  FOLLOW(T') = FOLLOW(T)\n  FOLLOW(F)  = { *, +, ), $ }\n\nLL(1) table:\n  M[E, id] = E -> T E'\n  M[E, (]  = E -> T E'\n  M[E', +] = E' -> + T E'\n  M[E', )] = E' -> epsilon\n  M[E', $] = E' -> epsilon\n  ...",
 invariant:"LL(1) grammars have no left recursion and are left-factored. The parsing table has at most one entry per cell.",
 uses:"Hand-written parsers, many production compilers (GCC, Clang, Rust).",
 strength:"Simple, fast, easy to debug, error messages are easy to produce.",
 limits:"Cannot handle left-recursive grammars without transformation. Less powerful than LR.",
 pitfall:"Left recursion causes infinite recursion. Always eliminate it first.",
 question:"Why must LL(1) grammars be left-factored?",
 answer:"Two productions with the same prefix make the table entry ambiguous. Left-factoring removes the shared prefix.",
 demo:"recursive-descent",sample:"id + id * id",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 4","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 3","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"],
  ["Grune and Jacobs, Parsing Techniques: A Practical Guide, 2nd ed., Springer 2008","https://link.springer.com/book/10.1007/978-0-387-68954-8"]]},
{id:"pratt-parsing",title:"Pratt parsing and operator precedence",level:4,kind:"Parsing",status:"Runnable teaching lab",
 summary:"Pratt parsing (top-down operator precedence) parses expressions with a table of binding powers. It is compact, fast and handles prefix, infix and postfix operators naturally.",
 mental:"A table of binding powers, a loop",
 mentalText:"Each operator has a left binding power and a right binding power. The parser reads a prefix expression, then loops: while the next operator binds tighter than the current level, recurse.",
 steps:["Define the binding powers for each operator.","Write parseExpr(minBP).","Read a prefix (literal, unary operator, parenthesized).","Loop: while the next token is an infix operator with leftBP > minBP, recurse with rightBP.","Return the expression."],
 pseudo:"Pratt parser:\n  def parse_expr(min_bp):\n    token = next_token()\n    left = parse_prefix(token)\n    while True:\n      token = peek_token()\n      if not is_infix(token) or left_bp(token) <= min_bp:\n        break\n      consume(token)\n      left = parse_infix(left, token)\n    return left\n\n  def parse_prefix(token):\n    if token is number or identifier: return literal(token)\n    if token is unary operator:\n      operand = parse_expr(right_bp(token))\n      return unary(token, operand)\n    if token is '(':\n      e = parse_expr(0)\n      expect(')')\n      return e\n\n  def parse_infix(left, token):\n    right = parse_expr(left_bp(token))\n    return binary(left, token, right)\n\nBinding powers (example):\n  + - : left 10, right 11\n  * / : left 20, right 21\n  ^   : left 30, right 29 (right associative)\n  unary - : right 25\n\nThis handles precedence and associativity naturally.",
 invariant:"The left binding power determines when to stop the loop. The right binding power sets the recursion level.",
 uses:"Production parsers (Rust, Swift, Zig), expression parsers, configuration languages.",
 strength:"Compact, fast, no grammar transformation, handles prefix/infix/postfix.",
 limits:"Needs a hand-written parser. Less automatic than a parser generator.",
 pitfall:"Mixing up left and right binding powers gives the wrong associativity.",
 question:"How does Pratt parsing handle right associativity?",
 answer:"The right binding power is one less than the left binding power. For right-associative ^, left = 30 and right = 29, so the recursion stops at the same level and the operator groups to the right.",
 demo:"pratt",sample:"1 + 2 * 3 - 4 / 2",refs:[
  ["Pratt, Top down operator precedence, POPL 1973","https://doi.org/10.1145/512927.512931"],
  ["Nystrom, Crafting Interpreters, Ch. 17","https://craftinginterpreters.com/"],
  ["Parr, Language Implementation Patterns, Pragmatic Bookshelf 2010","https://pragprog.com/titles/tpdsl/language-implementation-patterns/"]]},
/* ================= 3 Semantic analysis ================= */
{id:"ast-symbols",title:"ASTs, symbol tables and scopes",level:3,kind:"Semantic",status:"Runnable teaching lab",
 summary:"An abstract syntax tree (AST) captures the structure of a program without the concrete syntax. A symbol table maps names to their declarations, organized by scope.",
 mental:"A tree of expressions and statements; a stack of name bindings",
 mentalText:"The AST for 'x = 1 + 2' is Assign(x, Add(1, 2)). The symbol table for a block records x and its type. Scopes nest.",
 steps:["Build the AST from the parse tree.","Walk the AST to build the symbol table.","Push a new scope when entering a block.","Look up names by walking up the scope chain.","Pop the scope when leaving the block."],
 pseudo:"AST node types:\n  Program(decls)\n  FuncDecl(name, params, body)\n  Block(stmts)\n  VarDecl(name, type, init)\n  Assign(target, value)\n  If(cond, then, else)\n  While(cond, body)\n  Return(expr)\n  Binary(op, left, right)\n  Unary(op, expr)\n  Call(callee, args)\n  Literal(value)\n  Ident(name)\n\nSymbol table (scope chain):\n  scopes = [global_scope]\n  push_scope() { scopes.push({}) }\n  pop_scope() { scopes.pop() }\n  declare(name, info) { scopes[-1][name] = info }\n  lookup(name):\n    for scope in reversed(scopes):\n      if name in scope: return scope[name]\n    return None\n\nResolving a name:\n  walk up the scope chain from the current scope\n  report an error if not found",
 invariant:"Every identifier must resolve to exactly one declaration. Shadowing is allowed but must be explicit in the scope chain.",
 uses:"Every compiler and interpreter. IDEs, refactoring tools, linters.",
 strength:"Simple, universal, well-understood. Easy to extend.",
 limits:"Name resolution is the easy part; type checking is harder.",
 pitfall:"Forgetting to pop a scope at the end of a block leaks names into the next block.",
 question:"What is the difference between an AST and a parse tree?",
 answer:"A parse tree mirrors the grammar with every production. An AST abstracts away irrelevant details (parentheses, punctuation) and keeps only the semantic structure.",
 demo:"ast",sample:"x = 1 + 2 * 3",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 5-6","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 4-5","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"],
  ["Nystrom, Crafting Interpreters, Ch. 8-11","https://craftinginterpreters.com/"]]},
{id:"type-checking",title:"Type checking",level:4,kind:"Semantic",status:"Runnable teaching lab",
 summary:"Type checking verifies that operations are applied to values of compatible types. It can be static (compile-time) or dynamic (run-time). Static typing catches errors early.",
 mental:"Every expression has a type; operations require compatible types",
 mentalText:"The rule for addition: if e1 has type int and e2 has type int, e1 + e2 has type int. If either is a float, the result is float. If either is a string, error (or coercion).",
 steps:["Assign types to literals and variables.","Walk the AST, inferring types bottom-up.","Check that each operation is valid for its operand types.","Unify types where the language allows polymorphism.","Report type errors with locations."],
 pseudo:"Typing rules (judgment: Gamma |- e : T):\n\n  Gamma |- n : int\n  Gamma |- x : Gamma(x)\n  Gamma |- e1 : int   Gamma |- e2 : int\n  ---------------------------------\n         Gamma |- e1 + e2 : int\n\n  Gamma |- e1 : float  Gamma |- e2 : float\n  -----------------------------------------\n         Gamma |- e1 + e2 : float\n\n  Gamma |- e1 : T1   Gamma |- e2 : T2   T1 ~ T2\n  -----------------------------------------------\n         Gamma |- e1 == e2 : bool\n\n  Gamma |- e1 : T1  Gamma |- e2 : T2\n  -----------------------------------\n   Gamma |- if e1 then e2 else e3 : T2 if T1 = bool\n\nSubtyping:\n  T1 <: T2 means T1 is a subtype of T2\n  if e : T1 and T1 <: T2 then e : T2\n\nCoercions:\n  int -> float (implicit)\n  float -> int (explicit, truncation)",
 invariant:"Type checking must be sound: a well-typed program does not get stuck at a type error. It is not always complete (some programs are rejected unnecessarily).",
 uses:"Every statically typed language: C, Java, Haskell, Rust, TypeScript, Swift.",
 strength:"Catches errors at compile time. Enables optimization. Documents intent.",
 limits:"Type inference is not always decidable for full dependent types. Some languages have dynamic typing.",
 pitfall:"Implicit coercions can hide bugs. Be explicit where possible.",
 question:"What is the difference between static and dynamic typing?",
 answer:"Static typing checks types at compile time. Dynamic typing checks at run time. Static typing catches errors earlier; dynamic typing is more flexible.",
 demo:"type-check",sample:"int x = 1\nfloat y = 2.0\nx + y",refs:[
  ["Pierce, Types and Programming Languages, MIT Press 2002","https://mitpress.mit.edu/9780262162098/types-and-programming-languages/"],
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 6","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cardelli, Type systems, Handbook of Computer Science 2004","https://doi.org/10.1201/9781420053173.ch2"]]},
{id:"hm-unification",title:"Hindley-Milner type inference and unification",level:5,kind:"Type theory",status:"Runnable teaching lab",
 summary:"Hindley-Milner infers the most general type of an expression without annotations. It uses unification to solve type equations and let-polymorphism to generalize.",
 mental:"Solve type equations by unification, generalize with let",
 mentalText:"For \\x. x, the type is a -> a. For let id = \\x. x in (id 1, id true), id is generalized to forall a. a -> a and instantiated at int and bool.",
 steps:["Assign type variables to unknown types.","Generate type equations from the AST.","Unify the equations with the occurs check.","Generalize at let bindings (quantify free type variables).","Instantiate at uses."],
 pseudo:"Types:\n  T = int | bool | T -> T | a (type variable)\n\nUnification:\n  unify(int, int) = ok\n  unify(a, T) = bind a to T (with occurs check)\n  unify(T1 -> T2, T3 -> T4) = unify(T1, T3) and unify(T2, T4)\n  unify(int, bool) = error\n\nAlgorithm W:\n  W(Gamma, x) = (instantiate(Gamma(x)), empty_subst)\n  W(Gamma, \\x. e):\n    beta = fresh type variable\n    (T, S) = W(Gamma + {x: beta}, e)\n    return (S(beta) -> T, S)\n  W(Gamma, e1 e2):\n    (T1, S1) = W(Gamma, e1)\n    (T2, S2) = W(S1(Gamma), e2)\n    beta = fresh type variable\n    S3 = unify(S2(T1), T2 -> beta)\n    return (S3(beta), S3 . S2 . S1)\n  W(Gamma, let x = e1 in e2):\n    (T1, S1) = W(Gamma, e1)\n    Gamma' = S1(Gamma)\n    T1' = generalize(Gamma', T1)   # quantify free type vars\n    (T2, S2) = W(Gamma' + {x: T1'}, e2)\n    return (T2, S2 . S1)\n\nGeneralization:\n  gen(Gamma, T) = forall a1...an. T\n  where a1...an = free(T) \\ free(Gamma)\n\nOccurs check:\n  unify(a, T) fails if a occurs in T\n  prevents infinite types like a = a -> a",
 invariant:"The inferred type is the most general type (principal type). Any other type is a specialization.",
 uses:"Haskell, ML, OCaml, F#, Elm, Rust (partial), TypeScript (partial).",
 strength:"No type annotations needed. Principal types. Well-understood.",
 limits:"Does not handle subtyping or higher-rank polymorphism directly. Type annotations may still be useful.",
 pitfall:"Forgetting the occurs check allows infinite types like a = a -> a, which break the type system.",
 question:"What is the most general type of \\x. \\y. x?",
 answer:"a -> b -> a. x has type a and y has type b, and the result is x, so the type is a -> b -> a.",
 demo:"hm",sample:"\\x. x\n(\\x. x) 1\nlet id = \\x. x in id",refs:[
  ["Hindley, The principal type-scheme of an object in combinatory logic, Trans. AMS 1969","https://doi.org/10.1090/S0002-9947-1969-0252775-1"],
  ["Milner, A theory of type polymorphism in programming, JCSS 1978","https://doi.org/10.1016/0022-0000(78)90014-4"],
  ["Pierce, Types and Programming Languages, Ch. 22","https://mitpress.mit.edu/9780262162098/types-and-programming-languages/"]]},
/* ================= 4 Automata and formal languages ================= */
{id:"dfa-min",title:"DFA minimization",level:4,kind:"Automata",status:"Runnable teaching lab",
 summary:"DFA minimization produces the smallest DFA accepting the same language. Hopcroft's algorithm partitions states by equivalence in O(n log n).",
 mental:"Merge states that behave identically",
 mentalText:"Two states are equivalent if they accept the same set of strings. Partition states into accepting and non-accepting, then refine by behavior on each symbol.",
 steps:["Remove unreachable states.","Partition states into accepting and non-accepting.","Refine: split each block by the blocks of its transitions.","Repeat until no block splits.","Each block becomes a state of the minimal DFA."],
 pseudo:"Hopcroft's algorithm:\n  P = {F, Q \\ F}       # accepting and non-accepting\n  W = {F}                # worklist\n  while W is not empty:\n    A = W.pop()\n    for each symbol c:\n      X = set of states with a transition on c into A\n      for each block Y in P that intersects X:\n        split Y into Y_n X and Y & X\n        replace Y in P with the two pieces\n        update W accordingly\n  return P as the minimal DFA\n\nTime: O(n log n)\n\nMyhill-Nerode:\n  the minimal DFA is unique up to isomorphism\n  states correspond to equivalence classes of the indistinguishability relation",
 invariant:"The minimal DFA is unique (up to state renaming). It has the fewest states of any DFA for the language.",
 uses:"Lexer generation, hardware design, protocol verification, model checking.",
 strength:"Smaller DFAs are faster and use less memory. Well-understood.",
 limits:"Minimization is overkill if the DFA is already small.",
 pitfall:"Forgetting to remove unreachable states first can keep extra states in the minimal DFA.",
 question:"What is the Myhill-Nerode theorem?",
 answer:"A language is regular iff the indistinguishability relation has finitely many equivalence classes. The number of classes equals the number of states in the minimal DFA.",
 demo:"dfa-min",sample:"",refs:[
  ["Hopcroft, An n log n algorithm for minimizing states in a finite automaton, 1971","https://doi.org/10.1016/B978-0-12-417750-5.50022-1"],
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 3","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Hopcroft et al., Introduction to Automata Theory, Ch. 4","https://www.pearson.com/en-us/subject-catalog/p/introduction-to-automata-theory-languages-and-computation/P200000003409"]]},
{id:"pda",title:"Pushdown automata and context-free grammars",level:4,kind:"Automata",status:"Concept lesson",
 summary:"A pushdown automaton (PDA) is an NFA with a stack. It recognizes exactly the context-free languages, the class of languages described by context-free grammars.",
 mental:"An FSM with a stack for nesting",
 mentalText:"Balanced parentheses: push on '(', pop on ')'. Accept if the stack is empty at the end. The stack gives unbounded memory.",
 steps:["Read the input.","For each symbol, decide whether to push, pop or neither, based on the current state and stack top.","Accept if a final state is reached with the stack in the accepted configuration.","Equivalently, derive the string from the grammar."],
 pseudo:"Pushdown automaton:\n  M = (Q, Sigma, Gamma, delta, q0, Z0, F)\n  Q: states\n  Sigma: input alphabet\n  Gamma: stack alphabet\n  delta: transition function\n  q0: start state\n  Z0: initial stack symbol\n  F: accepting states\n\nTransition:\n  delta(q, a, X) contains (p, gamma)\n  read a, pop X, push gamma, move to p\n\nExample: balanced parentheses\n  Q = {q0, q1}, Sigma = {(, )}, Gamma = {Z, (\n  delta(q0, (, Z) = (q0, ( Z)\n  delta(q0, (, () = (q0, ( (\n  delta(q0, ), () = (q0, epsilon)\n  delta(q0, epsilon, Z) = (q1, Z)\n\nContext-free grammar:\n  S -> ( S ) S | epsilon\n\nEquivalence:\n  PDA (accept by final state) = CFG\n\nDeterministic PDA < CFG:\n  deterministic PDAs recognize a strict subset (DCFL)",
 invariant:"The stack is LIFO. The PDA can only inspect the top of the stack.",
 uses:"Parsing, natural language processing, XML/HTML processing, protocol verification.",
 strength:"More powerful than FSM. Handles nesting.",
 limits:"Cannot handle cross-serial dependencies (e.g. a^n b^n c^n). A Turing machine is needed.",
 pitfall:"Confusing deterministic and nondeterministic PDAs. Only nondeterministic PDAs are equivalent to CFGs.",
 question:"What language does the grammar S -> ( S ) S | epsilon generate?",
 answer:"Balanced strings of parentheses. The grammar generates the Dyck language.",
 demo:"none",sample:"",refs:[
  ["Chomsky, Three models for the description of language, IRE Trans. Information Theory 1956","https://doi.org/10.1109/TIT.1956.1056813"],
  ["Hopcroft et al., Introduction to Automata Theory, Ch. 5-6","https://www.pearson.com/en-us/subject-catalog/p/introduction-to-automata-theory-languages-and-computation/P200000003409"],
  ["Sipser, Introduction to the Theory of Computation, Ch. 2","https://www.cengage.com/c/introduction-to-the-theory-of-computation-3e-sipser/9781133187790/"]]},
{id:"cyk-earley",title:"CYK and Earley parsing",level:5,kind:"Parsing",status:"Runnable teaching lab",
 summary:"CYK parses any CFG in Chomsky Normal Form in O(n^3). Earley parses any CFG in O(n^3) worst case and O(n) for unambiguous grammars. Both handle all context-free languages.",
 mental:"CYK: fill a table bottom-up; Earley: track items across positions",
 mentalText:"CYK: table[i][j] = nonterminals that derive the substring i..j. Earley: at each position, keep the set of productions being parsed and how far they have progressed.",
 steps:["CYK: convert the grammar to CNF.","CYK: fill the table for spans of increasing length.","CYK: accept if S is in table[0][n-1].","Earley: maintain a set of items at each position.","Earley: apply prediction, scanning and completion until no new items."],
 pseudo:"CYK:\n  table = n x n of sets of nonterminals\n  for i in 1..n:\n    for A -> w_i: table[i][i].add(A)\n  for length in 2..n:\n    for i in 1..n-length+1:\n      j = i + length - 1\n      for k in i..j-1:\n        for A -> B C:\n          if B in table[i][k] and C in table[k+1][j]:\n            table[i][j].add(A)\n  accept if S in table[1][n]\n\nEarley:\n  item = (production, dot position, start position)\n  chart[i] = set of items at position i\n\n  initialize: chart[0] with (S -> . alpha, 0)\n  for i in 0..n:\n    for each item in chart[i]:\n      if dot before a nonterminal B:\n        # prediction\n        for each B -> gamma: add (B -> . gamma, i) to chart[i]\n      elif dot before a terminal a:\n        # scanning\n        if input[i] == a: add (A -> alpha a . beta, j) to chart[i+1]\n      else:\n        # completion\n        for each (B -> gamma ., j) in chart[j]:\n          add (A -> alpha B . beta, j) to chart[i]\n  accept if (S -> alpha ., 0) in chart[n]\n\nComplexity:\n  CYK: O(n^3 |G|)\n  Earley: O(n^3) general, O(n^2) unambiguous, O(n) for many practical grammars",
 invariant:"CYK requires CNF. Earley works on any CFG without transformation.",
 uses:"Natural language parsing, parsing complex grammars, teaching parsing.",
 strength:"General CFG. Earley handles left recursion directly.",
 limits:"Cubic worst case. Slower than LL/LR for typical programming languages.",
 pitfall:"CYK needs CNF, which can blow up the grammar. Earley avoids this but is more complex.",
 question:"What is the worst-case complexity of Earley parsing?",
 answer:"O(n^3) for general CFGs, O(n^2) for unambiguous grammars, and often O(n) for practical programming languages.",
 demo:"cyk",sample:"S -> NP VP\nNP -> Det N\nVP -> V NP\nDet -> the\nN -> cat\nV -> ate\nthe cat ate the cat",refs:[
  ["Earley, An efficient context-free parsing algorithm, CACM 1970","https://doi.org/10.1145/362007.362035"],
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 4","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Grune and Jacobs, Parsing Techniques, 2nd ed.","https://link.springer.com/book/10.1007/978-0-387-68954-8"]]},
/* ================= 5 IR ================= */
{id:"cfg-3ac",title:"Control-flow graphs and three-address code",level:4,kind:"IR",status:"Runnable teaching lab",
 summary:"Three-address code breaks expressions into simple instructions with at most one operator. A control-flow graph (CFG) connects basic blocks with edges for control flow.",
 mental:"Small instructions, blocks connected by jumps",
 mentalText:"'x = a + b * c' becomes t1 = b * c; t2 = a + t1; x = t2. A basic block is a sequence with one entry and one exit. The CFG connects blocks that can follow each other.",
 steps:["Translate the AST to three-address code.","Group instructions into basic blocks.","Add edges between blocks for control flow.","Identify entry and exit blocks.","Run analyses on the CFG."],
 pseudo:"Three-address code:\n  x = y op z\n  x = op y\n  x = y\n  goto L\n  if x relop y goto L\n  param x ; call p, n ; return y\n  x = y[i] ; x[i] = y\n  x = &y ; x = *y ; *x = y\n\nBasic blocks:\n  a maximal sequence of instructions\n  no jumps in the middle\n  no jumps target the middle\n  entry: first instruction of the program\n  exit: last instruction or a jump\n\nCFG:\n  nodes = basic blocks\n  edge B1 -> B2 if the last instruction of B1 can jump to B2\n  entry node has no predecessors\n  exit node has no successors\n\nExample:\n  i = 0\n  L1: if i >= n goto L2\n      t = a[i]\n      s = s + t\n      i = i + 1\n      goto L1\n  L2: return s\n\n  Blocks: B1 (init), B2 (loop test), B3 (loop body), B4 (exit)\n  Edges: B1 -> B2, B2 -> B3, B2 -> B4, B3 -> B2",
 invariant:"Every instruction belongs to exactly one basic block. Control enters a block only at its first instruction and leaves only at its last.",
 uses:"Optimization, data-flow analysis, register allocation, instruction scheduling.",
 strength:"Simple IR. Easy to analyze. Standard in modern compilers.",
 limits:"Loses some high-level structure. SSA is a refinement.",
 pitfall:"Forgetting to add an edge for fall-through misses control flow. Every basic block's last instruction determines its successors.",
 question:"Why are basic blocks useful?",
 answer:"They make data-flow analysis local and efficient. Within a block, the order is fixed; between blocks, control flow is explicit.",
 demo:"cfg",sample:"i = 0\nL1: if i >= n goto L2\nt = a[i]\ns = s + t\ni = i + 1\ngoto L1\nL2: return s",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 6, 8","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 5, 8","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"],
  ["Muchnick, Advanced Compiler Design and Implementation, Morgan Kaufmann 1997","https://www.elsevier.com/books/advanced-compiler-design-and-implementation/muchnick/978-1-55860-320-2"]]},
{id:"ssa-phi",title:"SSA form and phi nodes",level:5,kind:"IR",status:"Runnable teaching lab",
 summary:"Static Single Assignment (SSA) gives every variable exactly one definition. Phi nodes merge values from different control-flow paths. SSA makes many optimizations simpler.",
 mental:"Each variable is assigned once; phi merges at joins",
 mentalText:"In SSA, x = 1 and x = 2 become x1 = 1 and x2 = 2. At a join, x3 = phi(x1, x2). Every use refers to exactly one definition.",
 steps:["Compute the dominator tree.","Insert phi nodes at join points (iterated dominance frontier).","Rename variables to make each definition unique.","Run optimizations.","Optionally convert out of SSA."],
 pseudo:"SSA construction:\n  1. Compute the dominance frontier DF(n) for each node n\n  2. For each variable v, place phi nodes at the iterated DF of the\n     blocks that define v\n  3. Rename: walk the dominator tree, maintaining a stack of\n     current definitions for each variable\n\nExample:\n  Original:\n    x = 0\n    if cond: x = 1\n    else: x = 2\n    y = x + 1\n\n  SSA:\n    x1 = 0\n    if cond: x2 = 1\n    else: x3 = 2\n    x4 = phi(x2, x3)\n    y1 = x4 + 1\n\nDominance frontier:\n  DF(n) = { m : n dominates a predecessor of m but n does not\n                 strictly dominate m }\n  DF of the if-then and if-else blocks contains the join block.\n\nIterated DF:\n  DF+(S) = closure of DF over S\n\nProperties:\n  each variable has one definition\n  def-use chains are explicit\n  many optimizations are simpler\n\nAlgorithms:\n  Cytron et al. (1991): efficient phi placement\n  Braun et al. (2013): simple and fast SSA construction",
 invariant:"Every use of a variable in SSA refers to exactly one definition, possibly a phi node.",
 uses:"LLVM, GCC, HotSpot, V8, modern compilers. SSA is the standard IR.",
 strength:"Simplifies optimization: constant propagation, dead-code elimination, GVN.",
 limits:"Phi nodes need to be eliminated before code generation (register allocation or out-of-SSA conversion).",
 pitfall:"Placing a phi node without considering the dominance frontier leaves some uses undefined. Always use the iterated DF.",
 question:"What does a phi node represent?",
 answer:"A merge of values from different control-flow paths. At a join, phi(x1, x2) selects x1 or x2 depending on which predecessor was taken.",
 demo:"ssa",sample:"x = 0\nif cond:\nx = 1\nelse:\nx = 2\ny = x + 1",refs:[
  ["Cytron et al., Efficiently computing static single assignment form and the control dependence graph, TOPLAS 1991","https://doi.org/10.1145/115372.115320"],
  ["Braun et al., Simple and efficient construction of static single assignment form, CC 2013","https://doi.org/10.1007/978-3-642-37051-9_6"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 9","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"]]},
{id:"dominators",title:"Dominators and the Lengauer-Tarjan algorithm",level:5,kind:"IR",status:"Concept lesson",
 summary:"A node d dominates n if every path from the entry to n passes through d. Dominator trees are the basis for SSA construction, loop detection and many optimizations.",
 mental:"d is on every path to n",
 mentalText:"The entry dominates every node. The immediate dominator idom(n) is the unique dominator closest to n. The dominator tree connects each node to its idom.",
 steps:["Compute the dominator sets by iteration or the Lengauer-Tarjan algorithm.","Build the dominator tree.","Compute the dominance frontier.","Use it for SSA, loop detection, and optimization."],
 pseudo:"Dominator definition:\n  d dom n iff every path from entry to n contains d\n  d strictly dominates n if d dom n and d != n\n  idom(n) = the unique dominator of n closest to n\n\nSimple iterative data-flow:\n  Dom(entry) = {entry}\n  Dom(n) = {n} union intersection over predecessors p of Dom(p)\n  iterate until a fixed point\n  time: O(n^2) worst case\n\nLengauer-Tarjan (1979):\n  O(m alpha(m, n)) nearly linear\n  uses semidominators and a union-find structure\n  semidominator sdom(n) = min over paths\n  idom from sdom via a union-find\n\nDominance frontier:\n  DF(n) = { m : n dominates a predecessor of m but n does not\n                 strictly dominate m }\n  used for phi placement in SSA\n\nDominator tree:\n  each node points to its idom\n  used for loop detection (back edges), SSA, and optimization",
 invariant:"Every node except the entry has exactly one immediate dominator. The dominator relation is a tree.",
 uses:"SSA construction, loop detection, control dependence, optimization, verification.",
 strength:"Fundamental structure. Enables many analyses.",
 limits:"Lengauer-Tarjan is intricate. The simple iterative version is easier but slower.",
 pitfall:"Confusing dominators with post-dominators. Post-dominators are about paths to the exit.",
 question:"What is the immediate dominator of a node?",
 answer:"The unique dominator of the node that is closest to it (strictly dominated by all other dominators).",
 demo:"none",sample:"",refs:[
  ["Lengauer and Tarjan, A fast algorithm for finding dominators in a flowgraph, TOPLAS 1979","https://doi.org/10.1145/357062.357071"],
  ["Cooper, Harvey, Kennedy, A simple, fast dominance algorithm, Software Practice & Experience 2001","https://doi.org/10.1002/spe.1006"],
  ["Cytron et al., Efficiently computing SSA form, TOPLAS 1991","https://doi.org/10.1145/115372.115320"]]},
/* ================= 6 Data-flow ================= */
{id:"reaching-defs",title:"Reaching definitions",level:4,kind:"Data-flow",status:"Runnable teaching lab",
 summary:"A definition reaches a point if there is a path from the definition to the point with no intervening redefinition. It is a forward may-analysis. Useful for constant propagation and use-def chains.",
 mental:"Which assignments can reach this point?",
 mentalText:"At the entry to a block, the reaching definitions are the union of the definitions reaching the end of each predecessor. A definition kills previous definitions of the same variable.",
 steps:["Compute GEN and KILL sets for each basic block.","Initialize IN and OUT sets.","Iterate: IN[b] = union of OUT[p] over predecessors.","OUT[b] = GEN[b] union (IN[b] minus KILL[b]).","Repeat until a fixed point."],
 pseudo:"Reaching definitions (forward, may):\n  IN[b]  = union over predecessors p of OUT[p]\n  OUT[b] = GEN[b] union (IN[b] - KILL[b])\n\nGEN[b] = definitions in b that reach the end of b\nKILL[b] = definitions of variables defined in b, from other blocks\n\nExample:\n  B1: d1: x = 1\n      d2: y = 2\n      goto B3\n  B2: d3: x = 3\n      goto B3\n  B3: d4: z = x + y\n\n  GEN[B1] = {d1, d2}, KILL[B1] = {d3}\n  GEN[B2] = {d3}, KILL[B2] = {d1}\n  GEN[B3] = {d4}, KILL[B3] = {}\n\n  IN[B3] = OUT[B1] union OUT[B2]\n         = {d1, d2} union {d3}\n         = {d1, d2, d3}\n\nUses:\n  constant propagation\n  use-def chains\n  dead code elimination\n\nComplexity: O(n^2) or better with bit vectors.",
 invariant:"Reaching definitions is a may-analysis: a definition may reach a point if there is any path. It is conservative.",
 uses:"Optimization (constant propagation, DCE), bug finding, program understanding.",
 strength:"Simple, general, well-understood.",
 limits:"Conservative: over-approximates. Can miss opportunities for optimization.",
 pitfall:"Forgetting to kill a definition of the same variable from another block gives wrong results.",
 question:"Is reaching definitions a may or must analysis?",
 answer:"May analysis. A definition reaches a point if there is at least one path from the definition to the point with no redefinition.",
 demo:"reaching",sample:"B1: x = 1; y = 2; goto B3\nB2: x = 3; goto B3\nB3: z = x + y",refs:[
  ["Kildall, A unified approach to global program optimization, POPL 1973","https://doi.org/10.1145/512927.512945"],
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 9","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 9","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"]]},
{id:"liveness",title:"Liveness analysis",level:4,kind:"Data-flow",status:"Runnable teaching lab",
 summary:"A variable is live at a point if its value may be used before being redefined. Liveness is a backward may-analysis. It drives register allocation.",
 mental:"Will this value be used again before it is overwritten?",
 mentalText:"At a use, the variable is live. At a definition, the variable becomes dead unless it is live after. Liveness propagates backwards.",
 steps:["Compute USE and DEF sets for each basic block.","Initialize IN and OUT sets.","Iterate: OUT[b] = union of IN[s] over successors s.","IN[b] = USE[b] union (OUT[b] minus DEF[b]).","Repeat until a fixed point."],
 pseudo:"Liveness (backward, may):\n  OUT[b] = union over successors s of IN[s]\n  IN[b]  = USE[b] union (OUT[b] - DEF[b])\n\nUSE[b] = variables used in b before being defined\nDEF[b] = variables defined in b before being used\n\nExample:\n  B1: d1: x = 1\n      d2: y = 2\n      goto B3\n  B2: d3: x = 3\n      goto B3\n  B3: d4: z = x + y\n\n  USE[B3] = {x, y}, DEF[B3] = {z}\n  IN[B3] = {x, y}\n  OUT[B1] = IN[B3] = {x, y}\n  IN[B1] = USE[B1] union (OUT[B1] - DEF[B1])\n         = {} union ({x, y} - {x, y})\n         = {}\n\n  x is live at the start of B3 (used in z = x + y)\n  y is live at the start of B3\n\nUses:\n  register allocation\n  dead code elimination\n  loop-invariant code motion\n  SSA construction",
 invariant:"Liveness is a may-analysis: a variable is live if there exists a path where it is used before being redefined.",
 uses:"Register allocation, optimization, debugging, verification.",
 strength:"Simple, backward, efficient with bit vectors.",
 limits:"Conservative: may report a variable as live when it is actually dead on all paths.",
 pitfall:"Reversing the direction (forward instead of backward) gives the wrong analysis.",
 question:"Why is liveness a backward analysis?",
 answer:"Liveness depends on the future: whether a variable will be used later. Backward analysis propagates information from uses to definitions.",
 demo:"liveness",sample:"B1: x = 1; y = 2; goto B3\nB2: x = 3; goto B3\nB3: z = x + y",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 9","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 9","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"],
  ["Chaitin et al., Register allocation via coloring, Computer Languages 1981","https://doi.org/10.1016/0096-0551(81)90048-5"]]},
{id:"const-prop",title:"Constant propagation and sparse analysis",level:4,kind:"Data-flow",status:"Runnable teaching lab",
 summary:"Constant propagation replaces variables known to be constant with their values. Sparse conditional constant propagation (SCCP) combines constant propagation and unreachable-code elimination.",
 mental:"Track which variables have known constant values",
 mentalText:"A variable is constant at a point if all reaching definitions assign the same constant. Propagate forward. If a variable is never used, eliminate the definition.",
 steps:["Initialize the lattice: Top (unknown), constants, Bottom (not constant).","Iterate over the CFG.","At each definition, update the variable's value.","At each use, replace with the constant if known.","Eliminate unreachable code."],
 pseudo:"Constant propagation lattice:\n  UNDEF < constants < NAC (not a constant)\n\n  meet(x, y) = x if x == y\n             = NAC otherwise\n\nTransfer:\n  x = c          -> x is c\n  x = y + z      -> x is c1 + c2 if y and z are constants\n                    else NAC\n  x = unknown    -> NAC\n\nSCCP (Wegman and Zadeck 1991):\n  combines constant propagation with unreachable-code elimination\n  uses a worklist of (block, edge) pairs\n  only explores reachable blocks\n  more precise than simple constant propagation\n\nExample:\n  x = 1\n  if cond: x = 2\n  y = x + 1\n\n  Simple: x is NAC (meet of 1 and 2)\n  SCCP:   same, unless cond is constant\n\nExample with dead code:\n  x = 1\n  if false: x = 2\n  y = x + 1\n\n  x is 1 (the false branch is unreachable)\n  y = 2",
 invariant:"The lattice must be monotone. Meet of different constants is NAC (not a constant).",
 uses:"Optimization (constant folding, DCE), bug finding, verification.",
 strength:"Simple, effective. SCCP is more precise than simple propagation.",
 limits:"Conservative: variables that are actually constant but have multiple definitions may be marked NAC.",
 pitfall:"Forgetting to handle unreachable code gives wrong results (a variable may be marked NAC because of a dead branch).",
 question:"What does NAC mean in constant propagation?",
 answer:"Not A Constant. The variable has multiple possible values at that point, so it cannot be replaced by a single constant.",
 demo:"const-prop",sample:"x = 1\ny = 2\nz = x + y\nif false:\nw = 99\nv = z + w",refs:[
  ["Wegman and Zadeck, Constant propagation with conditional branches, TOPLAS 1991","https://doi.org/10.1145/103135.103136"],
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 9","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 9, 10","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"]]},
{id:"abstract-interp",title:"Abstract interpretation",level:5,kind:"Analysis",status:"Concept lesson",
 summary:"Abstract interpretation runs a program on an abstract domain that approximates the concrete semantics. It gives sound but incomplete results. The choice of domain is the key design decision.",
 mental:"Run the program on an approximation of the values",
 mentalText:"Instead of exact values, track an abstract property (signs, intervals, polyhedra). Every concrete behavior is included in the abstract result.",
 steps:["Choose the abstract domain.","Define the abstraction and concretization functions.","Define abstract transfer functions for each instruction.","Iterate to a fixed point.","Report the abstract result."],
 pseudo:"Abstract interpretation:\n  concrete domain: actual values\n  abstract domain: approximation (signs, intervals, ...)\n\n  abstraction: alpha: concrete -> abstract\n  concretization: gamma: abstract -> concrete\n\n  Galois connection: alpha(c) <= a iff c <= gamma(a)\n\n  soundness: for every concrete state c,\n             gamma(alpha(c)) contains c\n\nTransfer functions:\n  abstract transfer for each instruction\n  must be monotone and sound\n\nFixed point:\n  iterate until no change\n  use widening and narrowing for infinite domains\n\nDomains (from cheap to expensive):\n  signs: {-, 0, +, T}\n  intervals: [lo, hi]\n  octagons: +/- x +/- y <= c\n  polyhedra: linear inequalities\n  congruence: x mod n = c\n\nApplications:\n  static analysis (Astrée, Polyspace, Infer)\n  compiler optimization\n  verification\n\nTrade-off:\n  more precise domain = more expensive\n  widening = force termination\n  narrowing = recover precision",
 invariant:"Abstract interpretation must be sound: it over-approximates the concrete behavior. If it says a property holds, it does.",
 uses:"Static analysis, verification, compiler optimization, bug finding.",
 strength:"Sound. Handles infinite state spaces. Widely used in industry.",
 limits:"Imprecise: may report false positives. Choice of domain is a trade-off.",
 pitfall:"Forgetting widening causes non-termination on loops with unbounded iteration.",
 question:"What is the difference between abstract interpretation and testing?",
 answer:"Abstract interpretation over-approximates all behaviors and gives sound results. Testing checks specific inputs and is incomplete.",
 demo:"none",sample:"",refs:[
  ["Cousot and Cousot, Abstract interpretation: a unified lattice model for static analysis, POPL 1977","https://doi.org/10.1145/512950.512973"],
  ["Cousot, Abstract interpretation based formal methods and future challenges, 2001","https://doi.org/10.1007/3-540-44577-3_10"],
  ["Nielson, Nielson, Hankin, Principles of Program Analysis, Springer 1999","https://link.springer.com/book/10.1007/978-3-662-03811-6"]]},
/* ================= 7 Optimization ================= */
{id:"const-fold",title:"Constant folding and dead-code elimination",level:4,kind:"Optimization",status:"Runnable teaching lab",
 summary:"Constant folding evaluates constant expressions at compile time. Dead-code elimination removes instructions whose results are never used. Both are simple, effective, and local.",
 mental:"Compute constants, remove useless code",
 mentalText:"'x = 2 + 3' becomes 'x = 5'. If x is never used, remove the assignment. Mark-and-sweep for dead code: start from observable effects, mark live instructions, remove the rest.",
 steps:["Constant fold: evaluate operations on constants.","Propagate constants.","DCE: mark instructions with observable effects (calls, returns, stores).","Propagate liveness backward.","Remove unmarked instructions."],
 pseudo:"Constant folding:\n  for each instruction:\n    if all operands are constants:\n      replace with the computed value\n\nConstant propagation:\n  replace uses of a variable with its constant value\n  requires reaching-definitions or SSA\n\nDead code elimination:\n  live instruction: has side effects (call, store, return, branch)\n  or its result is used by another live instruction\n  worklist algorithm:\n    mark all instructions with side effects\n    for each marked, mark its operands' definitions\n    remove unmarked instructions\n\nExample:\n  a = 1\n  b = 2\n  c = a + b    # c = 3\n  d = c * 2    # d = 6\n  return d     # return 6\n\n  After folding: a = 1; b = 2; c = 3; d = 6; return 6\n  After DCE:     return 6\n\nCooperating optimizations:\n  folding exposes dead code\n  DCE removes it\n  iterate to a fixed point",
 invariant:"Constant folding must be sound: the folded value must equal the runtime value. Overflow and floating-point must be handled carefully.",
 uses:"Every optimizing compiler. Also in interpreters (peephole) and JITs.",
 strength:"Simple, fast, effective. Exposes more optimization opportunities.",
 limits:"Needs constant propagation to be effective. Floating-point reassociation is not always safe.",
 pitfall:"Folding floating-point expressions can change results due to rounding. Be conservative or use a relaxed mode.",
 question:"Why are constant folding and DCE usually iterated?",
 answer:"Folding can expose dead code, and DCE can expose more constants. A fixed-point iteration captures more optimizations.",
 demo:"const-fold",sample:"a = 1\nb = 2\nc = a + b\nd = c * 2\nreturn d",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 9","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Muchnick, Advanced Compiler Design and Implementation, Ch. 12","https://www.elsevier.com/books/advanced-compiler-design-and-implementation/muchnick/978-1-55860-320-2"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 10","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"]]},
{id:"dce-cse",title:"Common-subexpression elimination and GVN",level:4,kind:"Optimization",status:"Runnable teaching lab",
 summary:"Common-subexpression elimination (CSE) finds and reuses repeated computations. Global value numbering (GVN) generalizes CSE with a hash of the expression tree.",
 mental:"If you compute the same thing twice, compute once",
 mentalText:"'a = b + c; d = b + c' becomes 'a = b + c; d = a'. GVN assigns a value number to each expression and replaces equivalent expressions with the same value.",
 steps:["Assign value numbers to expressions.","Hash each expression by operator and operand value numbers.","If the hash exists, replace with the existing value.","Iterate to a fixed point.","Run DCE to clean up."],
 pseudo:"Local CSE:\n  for each basic block:\n    for each instruction:\n      key = (op, operand1_value, operand2_value)\n      if key in table:\n        replace with table[key]\n      else:\n        table[key] = result\n\nGlobal value numbering (GVN):\n  assign a value number to each expression\n  two expressions with the same value number compute the same value\n  uses SSA form and phi nodes\n  more powerful than local CSE\n\nExample:\n  t1 = b + c\n  t2 = b + c\n  d = t1 + t2\n\n  After CSE: t1 = b + c; t2 = t1; d = t1 + t1\n  After DCE: t1 = b + c; d = 2 * t1 (with strength reduction)\n\nCSE and GVN are subsumed by:\n  hash-based global value numbering\n  partial redundancy elimination (PRE)\n  lazy code motion (LCM)\n\nPRE:\n  places the computation at a point that is optimal\n  eliminates redundant computations on some paths\n  LCM is a practical PRE algorithm",
 invariant:"CSE is sound only if the operands have the same value and no side effects between the two computations. Loads from memory may not be redundant.",
 uses:"Every optimizing compiler. GVN is a standard LLVM pass.",
 strength:"Powerful, reduces code size and runtime. GVN is precise.",
 limits:"Memory operations need alias analysis. Side effects complicate redundancy.",
 pitfall:"Assuming two loads from the same address give the same value. If the memory may have changed, they are not redundant.",
 question:"What is the difference between CSE and GVN?",
 answer:"CSE is a local optimization within a basic block. GVN is global, using value numbers to identify equivalent expressions across the whole function.",
 demo:"cse",sample:"a = 1\nb = 2\nt1 = a + b\nt2 = a + b\nc = t1 * t2\nreturn c",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 9","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Alpern, Wegman, Zadeck, Detecting equality of variables in programs, POPL 1988","https://doi.org/10.1145/73560.73561"],
  ["Kildall, A unified approach to global program optimization, POPL 1973","https://doi.org/10.1145/512927.512945"]]},
{id:"licm-inline",title:"Loop-invariant code motion and inlining",level:4,kind:"Optimization",status:"Runnable teaching lab",
 summary:"Loop-invariant code motion (LICM) moves computations that do not change inside a loop to the loop preheader. Inlining replaces a call with the body of the callee.",
 mental:"Hoist invariants out of loops; expand calls in place",
 mentalText:"If 'x = a * b' inside a loop does not depend on the loop variable, compute it once before the loop. If a call is small, inline it to expose more optimization.",
 steps:["LICM: identify loop-invariant computations.","LICM: ensure the loop is executed at least once or the computation is safe to hoist.","LICM: move the computation to the preheader.","Inlining: replace the call with the callee's body.","Inlining: substitute arguments for parameters and rename variables."],
 pseudo:"LICM:\n  for each loop L:\n    for each instruction i in L:\n      if all operands of i are defined outside L\n         and i has no side effects\n         and i dominates all loop exits (or the loop is executed at least once):\n        move i to the preheader of L\n\nExample:\n  for i in 1..n:\n    x = a * b\n    s = s + x\n\n  After LICM:\n  x = a * b\n  for i in 1..n:\n    s = s + x\n\nInlining:\n  replace call f(args) with:\n    substitute args for parameters\n    rename locals to avoid clashes\n    inline the body\n\nExample:\n  def square(x): return x * x\n  y = square(3 + 4)\n\n  After inlining:\n  t = 3 + 4\n  y = t * t\n\n  After constant folding: y = 49\n\nInlining heuristics:\n  function size, call site frequency, recursion\n  too much inlining = code bloat\n  too little = lost optimization opportunities",
 invariant:"LICM requires the loop to be executed at least once, or the computation to be safe to execute speculatively. Inlining must preserve semantics.",
 uses:"Every optimizing compiler. LICM is a standard LLVM pass.",
 strength:"LICM removes redundant work. Inlining exposes cross-function optimization.",
 limits:"LICM can increase register pressure. Inlining can bloat code.",
 pitfall:"Hoisting a computation that may throw or divide by zero changes semantics. Only hoist safe instructions.",
 question:"Why does LICM require the loop to be executed at least once?",
 answer:"If the loop body never runs, hoisting a computation that may have side effects or may trap would execute code that the original program would not. The hoisted code must be safe to execute.",
 demo:"licm",sample:"for i in 1..n:\nx = a * b\ns = s + x",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 9, 10","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Muchnick, Advanced Compiler Design and Implementation, Ch. 13-14","https://www.elsevier.com/books/advanced-compiler-design-and-implementation/muchnick/978-1-55860-320-2"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 10","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"]]},
/* ================= 8 Loop and memory ================= */
{id:"strength-reduce",title:"Strength reduction and induction-variable elimination",level:5,kind:"Loop opt",status:"Runnable teaching lab",
 summary:"Strength reduction replaces expensive operations (multiplication) with cheaper ones (addition). Induction-variable elimination removes redundant loop counters.",
 mental:"Replace i*k with a running sum",
 mentalText:"In a loop, 't = i * k' can be replaced by 't = t + k' initialized before the loop. This turns a multiplication into an addition.",
 steps:["Identify induction variables (i increases by a constant each iteration).","Identify expressions that are linear in the induction variable.","Replace with a new variable updated by addition.","Remove the old computations if they become dead."],
 pseudo:"Strength reduction:\n  for i in 1..n:\n    t = i * k\n    use(t)\n\n  becomes:\n  t = k\n  for i in 1..n:\n    use(t)\n    t = t + k\n\nInduction variable elimination:\n  for i in 1..n:\n    a[i] = 0\n\n  may use a pointer that advances by the element size\n\nExample: array indexing\n  for i in 1..n:\n    a[i] = 0\n\n  becomes:\n  p = &a[0]\n  for i in 1..n:\n    *p = 0\n    p = p + sizeof(int)\n\nVectorization:\n  for i in 1..n:\n    c[i] = a[i] + b[i]\n\n  becomes SIMD:\n  for i in 1..n step 4:\n    c[i..i+3] = a[i..i+3] + b[i..i+3]\n\nDependence analysis:\n  no loop-carried dependence = vectorizable\n  loop-carried dependence = not directly vectorizable",
 invariant:"Strength reduction is valid only if the induction variable and the expression are truly linear. Dependence analysis is required for vectorization.",
 uses:"Every optimizing compiler. Vectorization is essential for numerical code.",
 strength:"Reduces expensive operations to cheap ones. Enables vectorization.",
 limits:"Requires analysis to identify induction variables. Dependence analysis is undecidable in general.",
 pitfall:"Vectorizing a loop with a loop-carried dependence gives wrong results. Always check dependences.",
 question:"What is a loop-carried dependence?",
 answer:"A dependence between two iterations of a loop, e.g. a[i] depends on a[i-1]. It prevents vectorization because the iterations cannot be reordered.",
 demo:"strength",sample:"for i in 1..n:\nt = i * 4\ns = s + t",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 10, 11","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Muchnick, Advanced Compiler Design and Implementation, Ch. 14","https://www.elsevier.com/books/advanced-compiler-design-and-implementation/muchnick/978-1-55860-320-2"],
  ["Allen and Kennedy, Optimizing Compilers for Modern Architectures, Morgan Kaufmann 2002","https://www.elsevier.com/books/optimizing-compilers-for-modern-architectures/allen/978-1-55860-286-1"]]},
{id:"alias-escape",title:"Alias analysis and escape analysis",level:5,kind:"Memory",status:"Concept lesson",
 summary:"Alias analysis determines whether two pointers can refer to the same memory. Escape analysis determines whether an object can outlive its scope. Both are essential for optimization and memory management.",
 mental:"Can these two pointers point to the same thing? Can this object escape?",
 mentalText:"If p and q are must-not-alias, an optimization that reorders them is safe. If an object does not escape, it can be allocated on the stack or its fields can be kept in registers.",
 steps:["Build a points-to graph or use a type-based analysis.","Classify each pair of pointers as may-alias, must-alias, or no-alias.","For escape analysis, check whether the object can be stored in a heap or passed to a call.","Use the results to optimize."],
 pseudo:"Alias analysis:\n  may-alias(p, q): p and q may refer to the same location\n  must-alias(p, q): p and q always refer to the same location\n  no-alias(p, q): p and q never refer to the same location\n\n  Andersen's analysis (inclusion-based):\n    points-to sets\n    O(n^3) worst case\n\n  Steensgaard's analysis (unification-based):\n    union-find, near-linear\n    less precise\n\n  Flow-sensitive vs flow-insensitive\n\nEscape analysis:\n  does object o escape its scope?\n  escapes if:\n    stored in a global or heap\n    returned from the function\n    passed to a function that may store it\n    assigned to a field of an escaping object\n\n  if not escaping:\n    allocate on the stack\n    scalar replacement\n    eliminate synchronization\n\nExample:\n  def f():\n    p = new Point(1, 2)\n    return p.x + p.y\n\n  p does not escape\n  scalar replacement: p.x = 1; p.y = 2; return 1 + 2\n\nApplications:\n  optimization (CSE, LICM, DCE)\n  stack allocation\n  synchronization elimination\n  garbage collection\n  bug finding",
 invariant:"Alias analysis is undecidable in general. All practical analyses are conservative (may-alias).",
 uses:"Optimization, memory management, concurrency, garbage collection, bug finding.",
 strength:"Enables powerful optimizations. Escape analysis is the basis for stack allocation.",
 limits:"Conservative. Imprecise alias analysis can block many optimizations.",
 pitfall:"Assuming no-alias without proper analysis. A single alias breaks the optimization.",
 question:"What is the difference between Andersen's and Steensgaard's alias analysis?",
 answer:"Andersen's is inclusion-based (more precise, O(n^3)). Steensgaard's is unification-based (less precise, near-linear).",
 demo:"none",sample:"",refs:[
  ["Andersen, Program analysis and specialization for the C programming language, Ph.D. thesis 1994","https://doi.org/10.7146/dpb.v23i463.6887"],
  ["Steensgaard, Points-to analysis in almost linear time, POPL 1996","https://doi.org/10.1145/237721.237727"],
  ["Blanchet, Escape analysis for object-oriented languages, OOPSLA 1999","https://doi.org/10.1145/320384.320389"]]},
/* ================= 9 Code generation ================= */
{id:"instr-select",title:"Instruction selection",level:4,kind:"Codegen",status:"Runnable teaching lab",
 summary:"Instruction selection maps IR operations to machine instructions. It uses pattern matching against a set of instruction templates. Optimal selection minimizes cost (size or cycles).",
 mental:"Match IR trees against instruction patterns",
 mentalText:"Each machine instruction is a pattern. The selector finds a covering of the IR tree with the cheapest patterns. Tree tiling is the standard formulation.",
 steps:["Define the instruction patterns and their costs.","Build the IR tree.","Find a minimal-cost covering.","Emit the selected instructions."],
 pseudo:"Tree tiling:\n  IR tree nodes = operations\n  instruction patterns = tree fragments\n  cost = size, cycles, or a combination\n  find the minimal-cost covering\n\nDynamic programming:\n  for each node n:\n    cost[n] = min over patterns p matching n of\n              cost(p) + sum over children of cost[child]\n\nExample:\n  IR: t1 = a + b\n      t2 = t1 * c\n\n  Instructions:\n    ADD r, a, b   (1 cycle)\n    MUL r, t, c   (3 cycles)\n\n  Covering: ADD then MUL (4 cycles)\n\n  Alternative (fused):\n    MUL_ADD r, c, (a+b)   (3 cycles)\n  Cheaper if the target has a fused multiply-add.\n\nCISC vs RISC:\n  CISC: complex instructions, more patterns\n  RISC: simple instructions, easier selection\n\nBURS (Bottom-Up Rewrite System):\n  automates instruction selection from a grammar\n  used in GCC, LLVM (to some extent)",
 invariant:"The selected instructions must compute the same result as the IR. Costs must reflect the target machine.",
 uses:"Every compiler backend. Fused multiply-add, SIMD, and GPU kernels are common.",
 strength:"Significant performance improvements from good instruction selection.",
 limits:"The number of patterns can be large. Optimal selection is NP-hard for some cost models.",
 pitfall:"Ignoring instruction latencies and the pipeline gives suboptimal selection.",
 question:"Why is fused multiply-add (FMA) important?",
 answer:"It computes a * b + c in one instruction with one rounding. It is faster and more accurate than separate multiply and add.",
 demo:"instr-select",sample:"a + b * c",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 11","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 11","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"],
  ["Muchnick, Advanced Compiler Design and Implementation, Ch. 16","https://www.elsevier.com/books/advanced-compiler-design-and-implementation/muchnick/978-1-55860-320-2"]]},
{id:"reg-alloc",title:"Register allocation and graph coloring",level:5,kind:"Codegen",status:"Runnable teaching lab",
 summary:"Register allocation assigns variables to machine registers. Graph coloring builds an interference graph and colors it with K colors. Spilling handles variables with too many conflicts.",
 mental:"Color the interference graph with K registers",
 mentalText:"Two variables interfere if they are live at the same time. Build the interference graph, color it, and spill if necessary.",
 steps:["Compute liveness.","Build the interference graph.","Simplify: remove nodes with degree < K.","Color: assign colors in reverse order.","Spill: if coloring fails, spill a variable to memory."],
 pseudo:"Graph coloring:\n  K = number of registers\n\n  build: nodes = variables, edges = interference\n  simplify: repeatedly remove nodes with degree < K\n  if all nodes removed: color in reverse order\n  if stuck (all nodes have degree >= K): spill a node\n\nChaitin-Briggs:\n  simplify, coalesce, freeze, select, spill\n  coalescing merges non-interfering move-related nodes\n\nLinear scan:\n  sort intervals by start\n  maintain active intervals\n  when a new interval starts:\n    expire old intervals (free registers)\n    if no free register: spill the interval with the furthest end\n  fast (O(n log n)) but less optimal than graph coloring\n\nExample:\n  variables a, b, c, d\n  live ranges:\n    a: [1, 5]\n    b: [2, 4]\n    c: [3, 8]\n    d: [6, 9]\n  interference:\n    a-b, a-c, b-c, c-d\n  with 3 registers:\n    a=R1, b=R2, c=R3, d=R1\n\nSpilling:\n  if a variable is spilled, it is stored in memory\n  insert load/store around uses\n  re-run allocation\n  iterate until success",
 invariant:"Two variables that are live at the same point must not share a register.",
 uses:"Every compiler backend. Modern JITs use linear scan for speed.",
 strength:"Optimal for chordal graphs (which interference graphs often are). Well-understood.",
 limits:"Graph coloring is NP-hard in general. Spilling and re-coloring iterate.",
 pitfall:"Forgetting to include all live variables in the interference graph leads to incorrect allocation.",
 question:"What is the difference between graph coloring and linear scan?",
 answer:"Graph coloring builds an interference graph and colors it optimally (or near-optimally) but is slower. Linear scan is faster but less optimal, used in JITs.",
 demo:"reg-alloc",sample:"a: 1 5\nb: 2 4\nc: 3 8\nd: 6 9\n3",refs:[
  ["Chaitin et al., Register allocation via coloring, Computer Languages 1981","https://doi.org/10.1016/0096-0551(81)90048-5"],
  ["Briggs, Cooper, Torczon, Improvements to graph coloring register allocation, TOPLAS 1994","https://doi.org/10.1145/177492.177575"],
  ["Poletto and Sarkar, Linear scan register allocation, TOPLAS 1999","https://doi.org/10.1145/330249.330250"]]},
{id:"peephole-sched",title:"Peephole optimization and instruction scheduling",level:4,kind:"Codegen",status:"Runnable teaching lab",
 summary:"Peephole optimization replaces small instruction patterns with cheaper ones. Instruction scheduling reorders instructions to hide latency and improve throughput.",
 mental:"Improve small windows of code; reorder for the pipeline",
 mentalText:"A peephole replaces 'load r, x; load r, x' with 'load r, x'. Scheduling moves an independent load earlier to hide its latency.",
 steps:["Peephole: scan a sliding window of instructions.","Replace each window with the cheapest equivalent.","Scheduling: build a dependence graph.","Schedule instructions with a list scheduler.","Respect latencies and register pressure."],
 pseudo:"Peephole examples:\n  load r, x ; load r, x      -> load r, x\n  mul r, 2                   -> add r, r\n  add r, 0                   -> (delete)\n  jump L ; L:                -> L:\n  mov r, r                   -> (delete)\n\nInstruction scheduling:\n  dependence graph: nodes = instructions\n                    edges = data dependences (latency)\n                    edges = anti-dependences (register reuse)\n                    edges = control dependences\n  list scheduling:\n    ready = instructions with all predecessors scheduled\n    pick the one with highest priority (critical path)\n    schedule it at the earliest free cycle\n\n  Example (2-cycle multiply, 1-cycle add):\n    original:  MUL t, a, b\n               ADD s, t, c\n    schedule:  MUL t, a, b\n               (other independent work)\n               ADD s, t, c\n\n  Loop scheduling:\n    software pipelining\n    modulo scheduling\n    overlaps iterations to hide latency\n\nRegister pressure:\n  scheduling may increase live ranges\n  balance latency hiding with register pressure",
 invariant:"Scheduling must preserve data dependences and control dependences.",
 uses:"Every optimizing compiler backend. Peephole is used in JITs.",
 strength:"Improves performance with local changes.",
 limits:"Peephole can miss non-local patterns. Scheduling is NP-hard in general.",
 pitfall:"Reordering across a branch changes semantics if the reordered instruction can trap or has side effects.",
 question:"What is the critical path in instruction scheduling?",
 answer:"The longest chain of dependent instructions. Scheduling along the critical path first minimizes the overall schedule length.",
 demo:"peephole",sample:"load r1, x\nload r1, x\nmul r2, 2\nadd r3, 0\njump L\nL: return r1",refs:[
  ["Aho et al., Compilers: Principles, Techniques, and Tools, Ch. 11","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003409"],
  ["Muchnick, Advanced Compiler Design and Implementation, Ch. 16-17","https://www.elsevier.com/books/advanced-compiler-design-and-implementation/muchnick/978-1-55860-320-2"],
  ["Cooper and Torczon, Engineering a Compiler, Ch. 12","https://www.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815991-0"]]},
/* ================= 10 Security ================= */
{id:"taint",title:"Taint analysis",level:4,kind:"Security",status:"Runnable teaching lab",
 summary:"Taint analysis tracks data from untrusted sources (sources) through the program to sensitive sinks. If tainted data reaches a sink, it is a potential vulnerability.",
 mental:"Mark untrusted data, follow it to dangerous places",
 mentalText:"Mark input from the user as tainted. Propagate taint through assignments, function calls, and operations. Report if tainted data reaches a sink (SQL query, shell command, HTML output).",
 steps:["Identify sources (input, network, files).","Identify sinks (queries, commands, output).","Mark source values as tainted.","Propagate taint through the program.","Report sinks reached by tainted data."],
 pseudo:"Taint analysis:\n  source: value from user input, network, file\n  sink: SQL query, shell command, HTML output\n  sanitizer: function that removes taint\n\n  taint(x) = true if x is tainted\n  taint(f(x)) = taint(x) if f is not a sanitizer\n  taint(sanitize(x)) = false\n\nExample:\n  name = read_input()          # name is tainted\n  query = \"SELECT * FROM users WHERE name = '\" + name + \"'\"\n  execute(query)               # SINK: tainted data reaches query\n\n  after sanitize:\n  name = sanitize(read_input())  # name is clean\n  execute(\"...\" + name + \"'\")   # no taint\n\nTypes:\n  static taint analysis (compile time)\n  dynamic taint analysis (runtime, tracks actual data)\n\nStatic analysis:\n  data-flow analysis on the taint domain\n  flow-sensitive and context-sensitive\n  may-taint (conservative)\n\nDynamic analysis:\n  tracks taint at runtime\n  precise but slower\n  used in Dytan, libdft, PANDA",
 invariant:"A taint analysis is sound if it reports all possible flows. It may have false positives (over-tainting) or false negatives (under-tainting).",
 uses:"Security: SQL injection, XSS, command injection, path traversal.",
 strength:"Catches injection vulnerabilities. Well-understood.",
 limits:"False positives from over-tainting. Cannot track all flows precisely.",
 pitfall:"Sanitizers must be trusted. An incomplete sanitizer leaves the program vulnerable.",
 question:"What is the difference between static and dynamic taint analysis?",
 answer:"Static taint analysis is at compile time and over-approximates. Dynamic taint analysis tracks actual data at runtime and is precise but slower.",
 demo:"taint",sample:"name = read_input()\nquery = \"SELECT * FROM users WHERE name = '\" + name + \"'\"\nexecute(query)",refs:[
  ["Schwartz, Avgerinos, Brumley, All you ever wanted to know about dynamic taint analysis, IEEE S&P 2010","https://doi.org/10.1109/SP.2010.24"],
  ["Newsome and Song, Dynamic taint analysis for automatic detection, analysis, and signature generation, NDSS 2005","https://www.ndss-symposium.org/ndss2005/"],
  ["Livshits and Lam, Finding security vulnerabilities in Java applications with static analysis, USENIX Security 2005","https://www.usenix.org/legacy/events/sec05/tech/full_papers/livshits/livshits.pdf"]]},
{id:"symbolic-exec",title:"Symbolic execution and SMT path solving",level:5,kind:"Security",status:"Runnable teaching lab",
 summary:"Symbolic execution runs a program with symbolic inputs and explores paths. Each path has a path condition. An SMT solver checks satisfiability and finds concrete inputs.",
 mental:"Run the program with symbols, collect constraints, solve",
 mentalText:"Instead of concrete values, use symbols x, y. At a branch, fork the path and add the branch condition to the path condition. At the end, use an SMT solver to find inputs that satisfy the path condition.",
 steps:["Mark inputs as symbolic.","Execute the program symbolically.","At each branch, fork and update path conditions.","At the end, solve the path condition with an SMT solver.","Report concrete inputs and the path."],
 pseudo:"Symbolic execution:\n  state = (path_condition, symbolic_store, program_counter)\n  symbolic inputs: symbols instead of values\n\n  at each assignment:\n    update the symbolic store\n  at each branch:\n    fork the state\n    add the branch condition to path_condition\n\n  at the end:\n    path_condition is a formula over the inputs\n    solve with an SMT solver\n\nExample:\n  x = symbolic_input()\n  y = symbolic_input()\n  if x > 0:\n    if y == x * 2:\n      assert(y > 0)\n\n  Path 1: x > 0 and y == 2x\n    check y > 0: 2x > 0 since x > 0. Assertion holds.\n  Path 2: x > 0 and y != 2x\n    assertion not reached\n  Path 3: x <= 0\n    assertion not reached\n\nSMT solvers:\n  Z3, CVC5, Boolector, MathSAT\n  decide formulas over integers, reals, bit-vectors, arrays\n\nApplications:\n  test input generation\n  bug finding\n  verification\n  exploit generation\n\nTools:\n  KLEE, S2E, angr, Manticore, Triton, SymCC",
 invariant:"Symbolic execution explores all paths. The number of paths can be exponential. Path explosion is the main challenge.",
 uses:"Test generation, bug finding, verification, reverse engineering, exploit development.",
 strength:"Explores all paths. Finds bugs that testing misses.",
 limits:"Path explosion. Loops with symbolic bounds. External calls. SMT solver limitations.",
 pitfall:"Ignoring loops or external calls gives incomplete results. Bound the loop depth or use summaries.",
 question:"What is path explosion?",
 answer:"The number of execution paths grows exponentially with branches. Symbolic execution cannot explore all paths for large programs.",
 demo:"symbolic-exec",sample:"x = symbolic()\ny = symbolic()\nif x > 0:\nif y == x * 2:\nassert(y > 0)",refs:[
  ["King, Symbolic execution and program testing, CACM 1976","https://doi.org/10.1145/360248.360252"],
  ["Cadar et al., KLEE: Unassisted and automatic generation of high-coverage tests for complex systems programs, OSDI 2008","https://www.usenix.org/legacy/events/osdi08/tech/full_papers/cadar/cadar.pdf"],
  ["De Moura and Bjørner, Z3: An efficient SMT solver, TACAS 2008","https://doi.org/10.1007/978-3-540-78800-3_24"]]},
{id:"fuzzing",title:"Fuzzing and static analysis for security",level:4,kind:"Security",status:"Concept lesson",
 summary:"Fuzzing feeds random or mutated inputs to a program to find crashes. Coverage-guided fuzzing uses feedback from the program to guide mutations toward new paths. Static analysis finds bugs without running the program.",
 mental:"Throw inputs at the program, keep the ones that explore new paths",
 mentalText:"A fuzzer generates inputs, runs the program, and observes coverage. Inputs that reach new code are kept and mutated further. This is coverage-guided fuzzing.",
 steps:["Start with a corpus of inputs.","Mutate an input.","Run the program and record coverage.","If new coverage, add to the corpus.","Repeat.","When a crash occurs, minimize the input and report."],
 pseudo:"Coverage-guided fuzzing (AFL-style):\n  corpus = initial inputs\n  while not done:\n    input = mutate(random choice from corpus)\n    coverage = run(input)\n    if coverage is new:\n      corpus.add(input)\n    if crash:\n      report(minimize(input))\n\nMutation strategies:\n  bit flips, byte flips, arithmetic, insert/delete, splice\n  dictionary-based (keywords, magic values)\n\nCoverage:\n  edge coverage (AFL)\n  path coverage\n  value profile (AFL++)\n\nSanitizers:\n  ASan (address), MSan (memory), UBSan (undefined behavior)\n  crash on the first bug\n\nFuzzing vs static analysis:\n  fuzzing: dynamic, finds real bugs, needs a seed corpus\n  static: finds bugs without running, may have false positives\n\nHybrid:\n  concolic testing (concrete + symbolic)\n  libFuzzer, AFL++, Honggfuzz, OSS-Fuzz",
 invariant:"Fuzzing finds crashes, not all bugs. Coverage is a proxy for thoroughness. Sanitizers turn silent bugs into crashes.",
 uses:"Security testing, quality assurance, bug finding, protocol testing.",
 strength:"Finds real bugs. Coverage-guided fuzzing is very effective.",
 limits:"Cannot prove absence of bugs. Needs a good corpus. Fuzzing time.",
 pitfall:"Fuzzing without sanitizers misses memory bugs that do not crash. Always enable ASan/UBSan.",
 question:"What is the difference between fuzzing and symbolic execution?",
 answer:"Fuzzing runs the program with concrete inputs and observes coverage. Symbolic execution runs with symbolic inputs and solves constraints. Fuzzing scales better; symbolic execution is more thorough on small programs.",

 demo:"none",sample:"",refs:[
  ["Zalewski, American Fuzzy Lop (AFL), 2013","https://lcamtuf.coredump.cx/afl/"],
  ["Böhme, Pham, Roychoudhury, Coverage-based greybox fuzzing as Markov chain, CCS 2016","https://doi.org/10.1145/2976749.2978428"],
  ["Manès et al., The art, science, and engineering of fuzzing: A survey, IEEE TSE 2019","https://doi.org/10.1109/TSE.2019.2946563"]]},
/* ================= 11 Verification ================= */
{id:"hoare-logic",title:"Hoare logic and proof obligations",level:5,kind:"Verification",status:"Runnable teaching lab",
 summary:"Hoare logic specifies programs with preconditions and postconditions. The triple {P} C {Q} says: if P holds before C, then Q holds after C. Verification generates proof obligations.",
 mental:"Precondition, program, postcondition",
 mentalText:"{x = 0} x := x + 1 {x = 1}. The rule for assignment: {P[x := e]} x := e {P}. For sequences, compose. For loops, find an invariant.",
 steps:["Write the precondition and postcondition.","Apply the Hoare rules to generate proof obligations.","For loops, find an invariant that holds before and after each iteration.","Discharge the obligations with an SMT solver or a proof assistant."],

 "regex-fsm":{python:`# Regex to NFA (Thompson construction) - simplified

class NFA:
    def __init__(self):
        self.transitions = {}  # (state, symbol) -> set of states
        self.epsilon = {}      # state -> set of states
        self.start = 0
        self.accept = 1
        self.next_state = 2
    def new_state(self):
        s = self.next_state
        self.next_state += 1
        return s
    def add_transition(self, s, a, t):
        self.transitions.setdefault((s, a), set()).add(t)
    def add_epsilon(self, s, t):
        self.epsilon.setdefault(s, set()).add(t)

def build_nfa(regex):
    nfa = NFA()
    # Very simplified: handle literal and concatenation only
    # Full Thompson handles |, *, +, ?, ()
    states = [nfa.start]
    for ch in regex:
        new_state = nfa.new_state()
        nfa.add_transition(states[-1], ch, new_state)
        states.append(new_state)
    nfa.accept = states[-1]
    return nfa

nfa = build_nfa("abc")

 "subset-construction":{python:`def epsilon_closure(nfa, states):
    result = set(states)
    stack = list(states)
    while stack:
        s = stack.pop()
        for t in nfa.get(s, set()):
            if t not in result:
                result.add(t)
                stack.append(t)
    return result

def subset_construction(nfa_transitions, nfa_epsilon, start, accept, alphabet):
    start_set = frozenset(epsilon_closure(nfa_epsilon, {start}))
    dfa_states = {start_set: 0}
    dfa_transitions = {}
    queue = [start_set]
    while queue:
        S = queue.pop(0)
        for a in alphabet:
            move = set()
            for s in S:
                move |= nfa_transitions.get((s, a), set())
            T = frozenset(epsilon_closure(nfa_epsilon, move))
            if not T: continue
            if T not in dfa_states:
                dfa_states[T] = len(dfa_states)
                queue.append(T)
            dfa_transitions[(dfa_states[S], a)] = dfa_states[T]
    dfa_accept = {dfa_states[S] for S in dfa_states if accept in S}
    return dfa_states, dfa_transitions, dfa_accept

 "recursive-descent":{python:`# Recursive descent parser for expression grammar
# E -> T E'
# E' -> + T E' | epsilon
# T -> F T'
# T' -> * F T' | epsilon
# F -> ( E ) | id

class Parser:
    def __init__(self, tokens):
        self.tokens = tokens
        self.pos = 0
    def peek(self):
        return self.tokens[self.pos] if self.pos < len(self.tokens) else ("EOF", "")
    def consume(self, expected=None):
        tok = self.tokens[self.pos]
        if expected and tok[0] != expected:
            raise SyntaxError(f"Expected {expected}, got {tok}")
        self.pos += 1
        return tok
    def parse(self):
        return self.E()
    def E(self):
        left = self.T()
        return self.EPrime(left)
    def EPrime(self, left):
        if self.peek()[0] == "OP" and self.peek()[1] == "+":
            self.consume()
            right = self.T()
            return ("+", left, self.EPrime(right))
        return left
    def T(self):
        left = self.F()
        return self.TPrime(left)
    def TPrime(self, left):
        if self.peek()[0] == "OP" and self.peek()[1] == "*":
            self.consume()
            right = self.F()
            return ("*", left, self.TPrime(right))
        return left
    def F(self):
        tok = self.peek()
        if tok[0] == "ID":
            self.consume()
            return ("id", tok[1])
        if tok[0] == "OP" and tok[1] == "(":
            self.consume()
            e = self.E()
            self.consume("OP")  # )
            return e
        raise SyntaxError(f"Unexpected {tok}")

tokens = [("ID","x"),("OP","+"),("ID","y"),("OP","*"),("ID","z")]
print(Parser(tokens).parse())

 "pratt":{python:`# Pratt parser for arithmetic expressions

def tokenize(s):
    import re
    return re.findall(r"\\d+|[+\\-*/()]", s)

def parse(s):
    tokens = tokenize(s)
    pos = [0]
    def peek():
        return tokens[pos[0]] if pos[0] < len(tokens) else None
    def consume():
        t = peek(); pos[0] += 1; return t
    def parse_expr(min_bp):
        tok = consume()
        if tok == '(':
            left = parse_expr(0)
            consume()  # )
        elif tok.isdigit():
            left = int(tok)
        elif tok == '-':
            left = -parse_expr(25)
        else:
            raise SyntaxError(tok)
        while True:
            op = peek()
            if op is None: break
            lbp = {'+': 10, '-': 10, '*': 20, '/': 20}.get(op, 0)
            if lbp <= min_bp: break
            consume()
            right = parse_expr(lbp)
            left = (op, left, right)
        return left
    return parse_expr(0)

class Node: pass

    def __repr__(self): return f"Num({self.value})"

def eval_ast(node):
    if isinstance(node, Num): return node.value
    if isinstance(node, BinOp):
        l = eval_ast(node.left); r = eval_ast(node.right)
        return {"+": l+r, "-": l-r, "*": l*r, "/": l/r}[node.op]
    raise ValueError(node)

def type_of(expr, env):
    if isinstance(expr, int):
        return "int"
    if isinstance(expr, float):
        return "float"
    if isinstance(expr, str):
        if expr in env:
            return env[expr]
        raise TypeError(f"Unbound variable {expr}")

 "hm":{python:`# Hindley-Milner type inference with unification

class TVar:
    _counter = 0
    def __init__(self):
        self.id = TVar._counter; TVar._counter += 1
    def __repr__(self): return f"T{self.id}"

class TFun:
    def __init__(self, arg, res):
        self.arg = arg; self.res = res
    def __repr__(self): return f"({self.arg} -> {self.res})"

def unify(t1, t2, subst=None):
    if subst is None: subst = {}
    t1 = walk(t1, subst); t2 = walk(t2, subst)
    if isinstance(t1, TVar):
        if occurs(t1, t2, subst):
            raise TypeError("Occurs check failed")
        subst[t1.id] = t2
        return subst
    if isinstance(t2, TVar):
        return unify(t2, t1, subst)
    if isinstance(t1, TFun) and isinstance(t2, TFun):
        subst = unify(t1.arg, t2.arg, subst)
        subst = unify(t1.res, t2.res, subst)
        return subst
    if t1 == t2:
        return subst
    raise TypeError(f"Cannot unify {t1} and {t2}")

def walk(t, subst):
    while isinstance(t, TVar) and t.id in subst:
        t = subst[t.id]
    return t

def occurs(v, t, subst):
    t = walk(t, subst)
    if isinstance(t, TVar): return t.id == v.id
    if isinstance(t, TFun):
        return occurs(v, t.arg, subst) or occurs(v, t.res, subst)
    return False

# Infer type of \\x. x
a = TVar()
subst = unify(a, a)
print("\\x. x :", TFun(a, a))

 "dfa-min":{python:`# DFA minimization via Hopcroft-style partition refinement

def minimize_dfa(states, alphabet, transitions, start, accept):
    # Remove unreachable states
    reachable = set()
    stack = [start]
    while stack:
        s = stack.pop()
        if s in reachable: continue
        reachable.add(s)
        for a in alphabet:
            t = transitions.get((s, a))
            if t is not None:
                stack.append(t)
    states = reachable & set(states)
    accept = reachable & set(accept)

    # Partition
    P = [accept, states - accept]
    P = [b for b in P if b]

    changed = True
    while changed:
        changed = False
        new_P = []
        for block in P:
            for a in alphabet:
                groups = {}
                for s in block:
                    t = transitions.get((s, a))
                    for i, b in enumerate(P):
                        if t in b:
                            groups.setdefault(i, set()).add(s)
                            break
                    else:
                        groups.setdefault(-1, set()).add(s)
                if len(groups) > 1:
                    new_P.extend(groups.values())
                    changed = True
                else:
                    new_P.append(block)
                    break
            else:
                new_P.append(block)
        # Deduplicate
        seen = []
        for b in new_P:
            if b not in seen: seen.append(b)
        P = seen
    return P

# Example: minimal DFA for (a|b)*ab

 "cyk":{python:`def cyk(grammar, sentence):
    words = sentence.split()
    n = len(words)
    table = [[set() for _ in range(n)] for _ in range(n)]
    # Lexical rules
    for i, w in enumerate(words):
        for A, prods in grammar.items():
            for p in prods:
                if len(p) == 1 and p[0] == w:
                    table[i][i].add(A)
    # Binary rules
    for length in range(2, n+1):
        for i in range(n-length+1):
            j = i + length - 1
            for k in range(i, j):
                for A, prods in grammar.items():
                    for p in prods:
                        if len(p) == 2 and p[0] in table[i][k] and p[1] in table[k+1][j]:
                            table[i][j].add(A)
    return "S" in table[0][n-1], table

def build_cfg(instructions):
    # instructions: list of (op, args)
    blocks = []
    current = []
    labels = {}
    for i, (op, args) in enumerate(instructions):
        if op == "label":
            if current:
                blocks.append(current); current = []
            labels[args[0]] = len(blocks)
        elif op == "goto":
            if current: blocks.append(current); current = []
            # record edge from this block to the target
        elif op == "if":

def to_ssa(instructions):
    # instructions: list of (dest, op, arg1, arg2)
    counters = {}
    rename = {}
    out = []
    for dest, op, a1, a2 in instructions:
        def r(x):
            if isinstance(x, str) and x in rename:
                return rename[x]
            return x
        new_dest = f"{dest}_{counters.get(dest, 0) + 1}"

    # blocks: list of (name, [defs])
    # succs: dict name -> [names]
    # preds: dict name -> [names]
    defs = {}
    for name, dlist in blocks:
        for d in dlist:
            defs[d] = name
    # GEN and KILL
    GEN = {}; KILL = {}
    for name, dlist in blocks:
        GEN[name] = set(dlist)
        KILL[name] = set()
        for other, other_defs in blocks:
            if other != name:
                for d in other_defs:
                    var = d.split(":")[0]
                    for d2 in dlist:
                        if d2.split(":")[0] == var:

    OUT = {n: set() for n, _ in blocks}

    while changed:

            for p in preds.get(name, []):
                new_IN |= OUT[p]
            new_OUT = GEN[name] | (new_IN - KILL[name])

    # Check: pre -> invariant
    # Check: invariant and B -> invariant after body
    # Check: invariant and not B -> post
    # This is a very simplified symbolic check for the sum example.
    # I: s = i*(i+1)//2
    # pre: n >= 0 and s = 0 and i = 0
    # post: s = n*(n+1)//2
    checks = []
    # pre -> I
    pre_ok = (0 == 0*(0+1)//2)
    checks.append(("pre -> I", pre_ok))
    # I and i < n -> I[i := i+1, s := s+i+1]
    # symbolic: s' = i'(i'+1)/2 where i' = i+1, s' = s + i + 1
    # s + i + 1 = (i+1)(i+2)/2
    # s = i(i+1)/2 (from invariant)
    # i(i+1)/2 + i + 1 = (i^2 + i + 2i + 2)/2 = (i^2 + 3i + 2)/2
    # (i+1)(i+2)/2 = (i^2 + 3i + 2)/2  ✓
    preserve_ok = True
    checks.append(("I and i < n -> I after body", preserve_ok))
    # I and i >= n -> post
    exit_ok = True
    checks.append(("I and i >= n -> post", exit_ok))
    return checks

/* 1 Lexer */
function demoLexer(text){
 const specs=[
  ["NUM",/\d+(\.\d+)?/],
  ["ID",/[A-Za-z_]\w*/],
  ["ASSIGN",/=/],
  ["PLUS",/\+/],
  ["MINUS",/-/],
  ["STAR",/\*/],
  ["SLASH",/\//],
  ["LPAREN",/\(/],
  ["RPAREN",/\)/],
  ["SKIP",/[ \t\n]+/],
  ["COMMENT",/#.*/],
 ];
 const tokens=[];
 let i=0;
 let err=null;
 while(i<text.length){
  let matched=false;
  for(const [name,re] of specs){
   re.lastIndex=i;
   const m=re.exec(text);
   if(m&&m.index===i){
    if(name==='SKIP'||name==='COMMENT'){i+=m[0].length;matched=true;break}
    tokens.push({type:name,lexeme:m[0],pos:i});
    i+=m[0].length;
    matched=true;
    break;
   }
  }
  if(!matched){err=`Unexpected character '${text[i]}' at position ${i}`;break}
 }
 if(err)return {encoded:`Error: ${err}`,decoded:'The lexer stopped at an illegal character.'};
 const lines=tokens.map(t=>`  (${t.type.padEnd(8)}, "${t.lexeme}", pos ${t.pos})`);
 return {
  encoded:`Input: ${text}\n\nTokens (${tokens.length}):\n${lines.join('\n')}`,
  decoded:`The lexer scans the input left to right, producing a token stream. Whitespace and comments are skipped.`
 };
}

function demoRegexFsm(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter a regex on the first line and a test string on the second.');
 const regex=lines[0].replace(/\s+/g,'');
 const test=lines[1]||'';
 // Build a simple NFA from the regex (literals, |, *, +, ?, parens)
 function parseRegex(s){
  // Very small recursive descent for regex
  let i=0;
  function parseAlternation(){
   let left=parseConcat();
   while(s[i]==='|'){i++;const right=parseConcat();left={type:'alt',a:left,b:right}}
   return left;
  }
  function parseConcat(){
   let items=[];
   while(i<s.length&&s[i]!=='|'&&s[i]!==')'){
    items.push(parseRepeat());
   }
   return items.length?items.reduce((a,b)=>({type:'cat',a,b})):{type:'eps'};
  }
  function parseRepeat(){
   let atom=parseAtom();
   while(s[i]==='*'||s[i]==='+'||s[i]==='?'){
    const op=s[i++];
    atom={type:op,a:atom};
   }
   return atom;
  }
  function parseAtom(){
   if(s[i]==='('){i++;const e=parseAlternation();if(s[i]===')')i++;return e}
   if(i<s.length){return {type:'lit',c:s[i++]}}
   return {type:'eps'};
  }
  return parseAlternation();
 }
 const ast=parseRegex(regex);
 // Build NFA with numbered states
 let nstate=0;
 function newState(){return nstate++}
 function build(node){
  if(node.type==='eps'){const s=newState(),a=newState();return {start:s,accept:a,eps:[[s,a]],trans:[]}}
  if(node.type==='lit'){const s=newState(),a=newState();return {start:s,accept:a,eps:[],trans:[[s,node.c,a]]}}
  if(node.type==='cat'){
   const A=build(node.a),B=build(node.b);
   return {start:A.start,accept:B.accept,eps:A.eps.concat(B.eps).concat([[A.accept,B.start]]),trans:A.trans.concat(B.trans)};
  }
  if(node.type==='alt'){
   const A=build(node.a),B=build(node.b);
   const s=newState(),a=newState();
   return {start:s,accept:a,
    eps:A.eps.concat(B.eps).concat([[s,A.start],[s,B.start],[A.accept,a],[B.accept,a]]),
    trans:A.trans.concat(B.trans)};
  }
  if(node.type==='*'){
   const A=build(node.a);
   const s=newState(),a=newState();
   return {start:s,accept:a,
    eps:A.eps.concat([[s,A.start],[s,a],[A.accept,A.start],[A.accept,a]]),
    trans:A.trans};
  }
  if(node.type==='+'){
   const A=build(node.a);
   const s=newState(),a=newState();
   return {start:s,accept:a,
    eps:A.eps.concat([[s,A.start],[A.accept,A.start],[A.accept,a]]),
    trans:A.trans};
  }
  if(node.type==='?'){
   const A=build(node.a);
   const s=newState(),a=newState();
   return {start:s,accept:a,
    eps:A.eps.concat([[s,A.start],[s,a],[A.accept,a]]),
    trans:A.trans};
  }

 }
 const nfa=build(ast);
 // Simulate NFA on test string
 function epsClosure(states){
  const set=new Set(states);
  const stack=[...states];
  while(stack.length){
   const s=stack.pop();
   for(const [a,b] of nfa.eps){
    if(a===s&&!set.has(b)){set.add(b);stack.push(b)}
   }

 const tokens=[];
 const re=/\s*(\d+|[A-Za-z_]\w*|[()+\-*/])/g;
 let m;
 let lastIndex=0;
 while((m=re.exec(raw))!==null){
  if(m.index!==lastIndex){
   throw Error(`Unexpected character at position ${lastIndex}: '${raw[lastIndex]}'`);
  }
  tokens.push(m[1]);
  lastIndex=re.lastIndex;
 }
 if(lastIndex<raw.length)throw Error(`Unexpected character: '${raw[lastIndex]}'`);
 let pos=0;
 function peek(){return tokens[pos]}
 function consume(expected){
  if(expected!==undefined&&peek()!==expected){
   throw Error(`Expected '${expected}', got '${peek()}'`);
  }
  return tokens[pos++];
 }
 // E -> T E'
 // E' -> + T E' | epsilon
 // T -> F T'
 // T' -> * F T' | epsilon
 // F -> ( E ) | id | num
 function E(){
  let left=T();
  while(peek()==='+'||peek()==='-'){
   const op=consume();
   const right=T();
   left={op,left,right};
  }
  return left;
 }
 function T(){
  let left=F();
  while(peek()==='*'||peek()==='/'){
   const op=consume();
   const right=F();
   left={op,left,right};
  }
  return left;
 }
 function F(){
  if(peek()==='('){
   consume('(');
   const e=E();
   consume(')');
   return e;
  }
  const t=consume();
  if(/^\d+$/.test(t))return {num:parseInt(t)};
  return {id:t};
 }
 const ast=E();
 if(pos<tokens.length)throw Error(`Unexpected token after expression: '${tokens[pos]}'`);
 function show(n){
  if(n.num!==undefined)return String(n.num);
  if(n.id)return n.id;
  return `(${n.op} ${show(n.left)} ${show(n.right)})`;
 }
 return {
  encoded:`Input: ${raw}\nTokens: [${tokens.join(', ')}]\n\nAST: ${show(ast)}`,
  decoded:`Recursive descent parses the expression with one function per nonterminal. The grammar is left-factored and handles operator precedence naturally.`
 };
}

/* 2 Pratt parser */
function demoPratt(text){
 const tokens=text.match(/\d+|[A-Za-z_]\w*|[+\-*/()]/g)||[];
 const bindingPower={
  '+':{l:10,r:11},
  '-':{l:10,r:11},
  '*':{l:20,r:21},
  '/':{l:20,r:21},
 };
 let pos=0;
 function peek(){return tokens[pos]}
 function consume(){return tokens[pos++]}
 function parseExpr(minBP){
  let left;
  const tok=peek();
  if(tok===undefined)throw Error('Unexpected end of input');
  if(tok==='('){
   consume();
   left=parseExpr(0);
   if(consume()!==')')throw Error('Expected )');
  } else if(tok==='-'){
   consume();
   left={op:'neg',arg:parseExpr(25)};
  } else if(/^\d+$/.test(tok)){
   consume();
   left={num:parseInt(tok)};
  } else if(/^[A-Za-z_]/.test(tok)){
   consume();
   left={id:tok};
  } else {
   throw Error(`Unexpected token '${tok}'`);
  }
  while(true){
   const op=peek();
   if(!op||!bindingPower[op])break;
   const bp=bindingPower[op];
   if(bp.l<=minBP)break;
   consume();
   const right=parseExpr(bp.r);
   left={op,left,right};
  }
  return left;
 }
 const ast=parseExpr(0);
 if(pos<tokens.length)throw Error(`Unexpected token after expression: '${tokens[pos]}'`);
 function show(n){
  if(n.num!==undefined)return String(n.num);
  if(n.id)return n.id;
  if(n.op==='neg')return `(- ${show(n.arg)})`;
  return `(${n.op} ${show(n.left)} ${show(n.right)})`;
 }
 return {
  encoded:`Input: ${text}\nTokens: [${tokens.join(', ')}]\n\nAST: ${show(ast)}\n\nBinding powers:\n  + - : left 10, right 11\n  * / : left 20, right 21\n  unary - : right 25`,
  decoded:`Pratt parsing uses binding powers to decide precedence and associativity. The loop continues while the next operator binds tighter than the current level.`
 };
}

/* 3 AST */
function demoAst(text){
 const tokens=text.match(/\d+|[A-Za-z_]\w*|[=+\-*/(),]/g)||[];
 let pos=0;
 function peek(){return tokens[pos]}
 function consume(){return tokens[pos++]}
 // Simple: parse an assignment or an expression
 function parseExpr(){
  let left=parseTerm();
  while(peek()==='+'||peek()==='-'){
   const op=consume();
   const right=parseTerm();
   left={op,left,right};
  }
  return left;
 }
 function parseTerm(){
  let left=parseFactor();
  while(peek()==='*'||peek()==='/'){
   const op=consume();
   const right=parseFactor();
   left={op,left,right};
  }
  return left;
 }
 function parseFactor(){
  if(peek()==='('){consume();const e=parseExpr();if(consume()!==')')throw Error('Expected )');return e}
  const t=consume();
  if(/^\d+$/.test(t))return {num:parseInt(t)};
  return {id:t};
 }
 let ast;
 if(tokens[1]==='='){
  const name=tokens[0];
  pos=2;
  ast={assign:{name,value:parseExpr()}};
 } else {
  ast=parseExpr();
 }
 if(pos<tokens.length)throw Error(`Unexpected token: '${tokens[pos]}'`);
 // Symbol table
 const symbols={};
 function collect(n){
  if(n.assign){symbols[n.assign.name]='var';collect(n.assign.value);return}
  if(n.id){symbols[n.id]=(symbols[n.id]||'var');return}
  if(n.num!==undefined)return;
  collect(n.left);collect(n.right);
 }
 collect(ast);
 function show(n,indent=0){
  const pad='  '.repeat(indent);
  if(n.assign)return `${pad}Assign(${n.assign.name})\n${show(n.assign.value,indent+1)}`;
  if(n.num!==undefined)return `${pad}Num(${n.num})`;
  if(n.id)return `${pad}Ident(${n.id})`;
  return `${pad}BinOp(${n.op})\n${show(n.left,indent+1)}\n${show(n.right,indent+1)}`;
 }
 return {
  encoded:`Input: ${text}\nTokens: [${tokens.join(', ')}]\n\nAST:\n${show(ast)}\n\nSymbols: ${Object.keys(symbols).join(', ')||'(none)'}`,
  decoded:`The AST captures the structure of the program. The symbol table records the names declared. Scopes nest, but this simple program has only one.`
 };
}

/* 3 Type checking */
function demoTypeCheck(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const env={};
 const errors=[];
 const exprLines=[];
 for(const line of lines){
  const m=line.match(/^\s*(int|float|string|bool)\s+([A-Za-z_]\w*)\s*=\s*(.+)$/);
  if(m){
   const type=m[1];
   const name=m[2];
   const expr=m[3];
   // Simple check: literal type
   let exprType='unknown';
   if(/^\d+$/.test(expr.trim()))exprType='int';
   else if(/^\d+\.\d+$/.test(expr.trim()))exprType='float';
   else if(/^".*"$/.test(expr.trim()))exprType='string';
   else if(expr.trim()==='true'||expr.trim()==='false')exprType='bool';
   else if(env[expr.trim()])exprType=env[expr.trim()];
   else exprType='unknown';
   if(exprType!=='unknown'&&exprType!==type){
    errors.push(`Type mismatch: cannot assign ${exprType} to ${type} variable '${name}'`);
   }
   env[name]=type;
  } else {
   exprLines.push(line.trim());
  }
 }
 // Check expressions
 for(const line of exprLines){
  const parts=line.split(/([+\-*/])/).map(s=>s.trim()).filter(Boolean);
  let result='unknown';
  const types=[];
  for(const p of parts){
   if(/^[+\-*/]$/.test(p))continue;
   let t;
   if(/^\d+$/.test(p))t='int';
   else if(/^\d+\.\d+$/.test(p))t='float';
   else if(/^".*"$/.test(p))t='string';
   else t=env[p]||'unknown';
   types.push(t);
  }
  if(types.includes('unknown')){
   errors.push(`Expression '${line}': unknown variable`);
   result='unknown';
  } else if(types.every(t=>t==='int'))result='int';
  else if(types.every(t=>t==='int'||t==='float'))result='float';
  else errors.push(`Expression '${line}': cannot apply arithmetic to ${types.join(', ')}`);
  if(result!=='unknown')env['_expr']=result;
 }
 return {
  encoded:`Environment:\n${Object.entries(env).filter(([k])=>k!=='_expr').map(([k,v])=>`  ${k}: ${v}`).join('\n')||'  (empty)'}\n\nErrors:\n${errors.length?errors.map(e=>'  '+e).join('\n'):'  (none)'}`,
  decoded:`Type checking assigns types to variables and checks that operations are valid for their operand types. This simple example does not handle polymorphism or subtyping.`
 };
}

/* 3 Hindley-Milner */
function demoHm(text){
 // Simplified HM: infer types of lambda expressions and applications
 // Grammar: e := \x. e | e e | x | ( e )
 // Represent types as strings or type variables
 let typeCounter=0;
 const subst={};
 function fresh(){return 't'+(typeCounter++)}
 function walk(t){
  while(typeof t==='string'&&t in subst)t=subst[t];
  return t;
 }
 function occurs(v,t){
  t=walk(t);
  if(t===v)return true;
  if(typeof t==='object'&&t.op==='->')return occurs(v,t.arg)||occurs(v,t.res);
  return false;
 }
 function unify(a,b){
  a=walk(a);b=walk(b);
  if(a===b)return;
  if(typeof a==='string'&&a[0]==='t'){if(occurs(a,b))throw Error(`Occurs check: ${a} in ${JSON.stringify(b)}`);subst[a]=b;return}
  if(typeof b==='string'&&b[0]==='t'){if(occurs(b,a))throw Error(`Occurs check: ${b} in ${JSON.stringify(a)}`);subst[b]=a;return}
  if(typeof a==='object'&&typeof b==='object'&&a.op==='->'&&b.op==='->'){unify(a.arg,b.arg);unify(a.res,b.res);return}
  throw Error(`Cannot unify ${JSON.stringify(a)} and ${JSON.stringify(b)}`);
 }
 function typeToString(t){
  t=walk(t);
  if(typeof t==='string')return t;
  return `(${typeToString(t.arg)} -> ${typeToString(t.res)})`;
 }
 // Parse lambda expressions
 function parse(s){
  let i=0;
  function parseExpr(){
   let left=parseAtom();
   while(i<s.length&&s[i]!=='\\'&&s[i]!==')'){
    const right=parseAtom();
    left={op:'app',f:left,arg:right};
   }
   return left;
  }
  function parseAtom(){
   if(s[i]==='\\'){
    i++;
    let name='';
    while(i<s.length&&/[A-Za-z_]\w*/.test(s[i])){name+=s[i++]}
    if(s[i]!=='.')throw Error('Expected .');
    i++;
    const body=parseExpr();
    return {op:'abs',name,body};
   }
   if(s[i]==='('){i++;const e=parseExpr();if(s[i]!==')')throw Error('Expected )');i++;return e}
   let name='';
   while(i<s.length&&/[A-Za-z_]\w*/.test(s[i])){name+=s[i++]}
   if(!name)throw Error(`Unexpected character at ${i}: ${s[i]||'end'}`);
   return {op:'var',name};
  }
  return parseExpr();
 }
 function infer(node,env){
  if(node.op==='var'){
   if(node.name in env)return env[node.name];
   const t=fresh();env[node.name]=t;return t;
  }
  if(node.op==='abs'){
   const argType=fresh();
   const newEnv={...env,[node.name]:argType};
   const bodyType=infer(node.body,newEnv);
   return {op:'->',arg:argType,res:bodyType};
  }
  if(node.op==='app'){
   const fType=infer(node.f,env);
   const argType=infer(node.arg,env);
   const resType=fresh();
   unify(fType,{op:'->',arg:argType,res:resType});
   return resType;
  }
  throw Error('Unknown node');
 }
 const lines=text.trim().split(/\n/).filter(Boolean);
 const results=[];
 for(const line of lines){
  typeCounter=0;
  for(const k in subst)delete subst[k];
  try{
   const ast=parse(line.replace(/\s+/g,' '));
   const t=infer(ast,{});
   results.push(`${line} : ${typeToString(t)}`);
  }catch(e){
   results.push(`${line} : ERROR — ${e.message}`);
  }
 }
 return {
  encoded:`Hindley-Milner type inference:\n\n${results.join('\n')}\n\nSubstitutions:\n${Object.entries(subst).map(([k,v])=>`  ${k} -> ${typeToString(v)}`).join('\n')||'  (none)'}`,
  decoded:`HM infers the most general type. Unification solves type equations. The occurs check prevents infinite types.`
 };
}

/* 4 DFA minimization */
function demoDfaMin(text){
 // Example DFA with states 0..3, alphabet {a, b}, accept {2}
 const states=[0,1,2,3];
 const alphabet=['a','b'];
 const transitions={ '0,a':1, '0,b':2, '1,a':1, '1,b':3, '2,a':1, '2,b':2, '3,a':1, '3,b':3 };
 const accept=new Set([2]);
 // Partition refinement
 let P=[new Set([...accept]),new Set(states.filter(s=>!accept.has(s)))].filter(s=>s.size);
 let changed=true;
 while(changed){
  changed=false;
  const newP=[];
  for(const block of P){
   const groups=new Map();
   for(const s of block){
    const sig=alphabet.map(a=>{
     const t=transitions[`${s},${a}`];
     for(let i=0;i<P.length;i++)if(P[i].has(t))return i;
     return -1;
    }).join(',');
    if(!groups.has(sig))groups.set(sig,new Set());
    groups.get(sig).add(s);
   }
   if(groups.size>1){newP.push(...groups.values());changed=true}
   else newP.push(block);
  }
  P=newP;
 }
 const lines=P.map((b,i)=>`  Block ${i}: {${[...b].sort().join(', ')}}`);
 return {
  encoded:`DFA: states ${states.join(', ')}\nAlphabet: {${alphabet.join(', ')}}\nAccept: {${[...accept].join(', ')}}\nTransitions: ${JSON.stringify(transitions)}\n\nMinimal partition:\n${lines.join('\n')}\n\nMinimal DFA states: ${P.length}`,
  decoded:`Partition refinement merges equivalent states. Each block becomes a state of the minimal DFA. Hopcroft's algorithm is O(n log n).`
 };
}

/* 4 CYK */
function demoCyk(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const grammar={};
 let sentence='';
 for(const line of lines){
  if(line.includes('->')){
   const [lhs,rhs]=line.split('->').map(s=>s.trim());
   if(!grammar[lhs])grammar[lhs]=[];
   grammar[lhs].push(rhs.split(/\s+/));
  } else {
   sentence=line;
  }
 }
 if(!sentence)throw Error('No sentence found.');
 const words=sentence.split(/\s+/);
 const n=words.length;
 const table=Array.from({length:n},()=>Array.from({length:n},()=>new Set()));
 for(let i=0;i<n;i++){
  for(const A in grammar){
   for(const p of grammar[A]){
    if(p.length===1&&p[0]===words[i])table[i][i].add(A);
   }
  }
 }
 for(let len=2;len<=n;len++){
  for(let i=0;i<=n-len;i++){
   const j=i+len-1;
   for(let k=i;k<j;k++){
    for(const A in grammar){
     for(const p of grammar[A]){
      if(p.length===2&&table[i][k].has(p[0])&&table[k+1][j].has(p[1])){
       table[i][j].add(A);
      }
     }
    }
   }
  }
 }
 const accepted=table[0][n-1].has('S');
 return {
  encoded:`Grammar rules: ${Object.values(grammar).reduce((s,x)=>s+x.length,0)}\nSentence: ${sentence}\nTokens: ${n}\n\nAccepted: ${accepted}\n\nCYK table (nonterminals per span):\n${table.map((row,i)=>`  i=${i}: ${row.map((s,j)=>s.size?`[${i},${j}]:{${[...s].join(',')}}`:'').filter(Boolean).join(' ')}`).join('\n')}`,
  decoded:`CYK fills a table bottom-up. Each cell holds the nonterminals that derive the substring. The sentence is accepted if S is in table[0][n-1].`
 };
}

/* 5 CFG */
function demoCfg(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter instructions, one per line.');
 // Parse simple three-address-like instructions
 const instructions=[];
 for(const line of lines){
  const t=line.trim();
  if(t.endsWith(':')){
   instructions.push({type:'label',name:t.slice(0,-1)});
  } else if(/^goto\s+/.test(t)){
   instructions.push({type:'goto',target:t.split(/\s+/)[1]});
  } else if(/^if\s+/.test(t)){
   const m=t.match(/^if\s+(.+?)\s+goto\s+(\w+)$/);
   if(m)instructions.push({type:'if',cond:m[1],target:m[2]});
   else instructions.push({type:'assign',text:t});
  } else if(/^return\s+/.test(t)){
   instructions.push({type:'return',value:t.split(/\s+/)[1]});
  } else {
   instructions.push({type:'assign',text:t});
  }
 }
 // Group into basic blocks
 const blocks=[];
 let current=[];
 let currentLabel=null;
 function flush(){
  if(current.length||currentLabel!==null){
   blocks.push({label:currentLabel,instructions:current});
   current=[];
   currentLabel=null;
  }
 }
 for(const inst of instructions){
  if(inst.type==='label'){
   flush();
   currentLabel=inst.name;
  } else if(inst.type==='goto'||inst.type==='if'){
   current.push(inst);
   flush();
  } else {
   current.push(inst);
  }
 }
 flush();
 // Build edges
 const labelToBlock={};
 blocks.forEach((b,i)=>{if(b.label)labelToBlock[b.label]=i});
 const edges=[];
 blocks.forEach((b,i)=>{
  const last=b.instructions[b.instructions.length-1];
  if(!last)return;
  if(last.type==='goto'){
   if(labelToBlock[last.target]!==undefined)edges.push([i,labelToBlock[last.target]]);
  } else if(last.type==='if'){
   if(labelToBlock[last.target]!==undefined)edges.push([i,labelToBlock[last.target]]);
   if(i+1<blocks.length)edges.push([i,i+1]);
  } else {
   if(i+1<blocks.length)edges.push([i,i+1]);
  }
 });
 const blockLines=blocks.map((b,i)=>{
  const label=b.label?`${b.label}:`:'';
  const instrs=b.instructions.map(inst=>{
   if(inst.type==='assign')return inst.text;
   if(inst.type==='goto')return `goto ${inst.target}`;
   if(inst.type==='if')return `if ${inst.cond} goto ${inst.target}`;
   if(inst.type==='return')return `return ${inst.value}`;
   return '?';
  }).join('; ');
  return `  B${i} ${label} ${instrs}`;
 });
 const edgeLines=edges.map(([a,b])=>`  B${a} -> B${b}`);
 return {
  encoded:`Basic blocks (${blocks.length}):\n${blockLines.join('\n')}\n\nCFG edges:\n${edgeLines.join('\n')}`,
  decoded:`Basic blocks are maximal straight-line sequences. The CFG connects blocks with edges for control flow. This is the basis for all subsequent analyses.`
 };
}

/* 5 SSA */
function demoSsa(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 // Very simplified SSA for straight-line code
 const counters={};
 const rename={};
 const out=[];
 for(const line of lines){
  const m=line.match(/^\s*([A-Za-z_]\w*)\s*=\s*(.+)$/);
  if(!m){out.push(line);continue}
  const dest=m[1];
  const expr=m[2];
  function r(name){
   return rename[name]||name;
  }
  const newDest=`${dest}_${(counters[dest]||0)+1}`;
  counters[dest]=(counters[dest]||0)+1;
  const newExpr=expr.replace(/\b[A-Za-z_]\w*\b/g,(name)=>r(name));
  out.push(`${newDest} = ${newExpr}`);
  rename[dest]=newDest;
 }
 return {
  encoded:`SSA form:\n${out.map(l=>'  '+l).join('\n')}\n\nRenaming map: ${JSON.stringify(rename)}`,
  decoded:`SSA gives each variable a single definition. Phi nodes are needed at join points in a full SSA construction (not shown in this straight-line example).`
 };
}

/* 6 Liveness */
function demoLiveness(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 // Parse basic blocks: each line "B1: x = 1; y = 2"
 const blocks=[];
 for(const line of lines){
  const m=line.match(/^\s*(\w+):\s*(.+)$/);
  if(!m)continue;
  const name=m[1];
  const instrs=m[2].split(';').map(s=>s.trim()).filter(Boolean);
  const uses=[],defs=[];
  for(const inst of instrs){
   const assign=inst.match(/^\s*([A-Za-z_]\w*)\s*=\s*(.+)$/);
   if(assign){
    const dest=assign[1];
    const rhs=assign[2];
    for(const v of rhs.match(/\b[A-Za-z_]\w*\b/g)||[]){
     if(!defs.includes(v)&&!uses.includes(v))uses.push(v);
    }
    if(!defs.includes(dest))defs.push(dest);
   }
  }
  blocks.push({name,uses,defs});
 }
 // Successors: assume linear for simplicity
 const succs={};
 blocks.forEach((b,i)=>{
  const last=lines.find(l=>l.startsWith(b.name+':'));
  // Look for "goto Bn" or "if ... goto Bn"
  const m=last.match(/goto\s+(\w+)/);
  if(m){
   succs[b.name]=[m[1]];
   const cond=last.match(/if\s+(.+?)\s+goto/);
   if(cond&&i+1<blocks.length)succs[b.name].push(blocks[i+1].name);
  } else if(i+1<blocks.length){
   succs[b.name]=[blocks[i+1].name];
  } else {
   succs[b.name]=[];
  }
 });
 const IN={},OUT={};
 blocks.forEach(b=>{IN[b.name]=new Set();OUT[b.name]=new Set()});
 let changed=true;
 while(changed){
  changed=false;
  for(let i=blocks.length-1;i>=0;i--){
   const b=blocks[i];
   const newOut=new Set();
   for(const s of succs[b.name])for(const v of IN[s])newOut.add(v);
   const newIn=new Set(b.uses);
   for(const v of newOut)if(!b.defs.includes(v))newIn.add(v);
   if(newIn.size!==IN[b.name].size||newOut.size!==OUT[b.name].size){
    IN[b.name]=newIn;OUT[b.name]=newOut;changed=true;
   } else {
    for(const v of newIn)if(!IN[b.name].has(v)){IN[b.name]=newIn;OUT[b.name]=newOut;changed=true;break}
   }
  }
 }
 const lines2=blocks.map(b=>`  ${b.name}: USE={${b.uses.join(',')}} DEF={${b.defs.join(',')}}  IN={${[...IN[b.name]].join(',')}} OUT={${[...OUT[b.name]].join(',')}}`);
 return {
  encoded:`Liveness analysis:\n${lines2.join('\n')}`,
  decoded:`Liveness is a backward may-analysis. A variable is live at a point if its value may be used before being redefined. The result drives register allocation.`
 };
}

/* 7 Constant folding */
function demoConstFold(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const consts={};
 const out=[];
 for(const line of lines){
  const m=line.match(/^\s*([A-Za-z_]\w*)\s*=\s*(.+)$/);
  if(!m){out.push(line);continue}
  const dest=m[1];
  const expr=m[2].trim();
  // Try to evaluate
  let val;
  try{
   const jsExpr=expr.replace(/\b[A-Za-z_]\w*\b/g,(name)=>{
    if(name in consts)return consts[name];
    return name;
   });
   if(/^[\d\s+\-*/().]+$/.test(jsExpr)){
    val=eval(jsExpr);
   } else {
    val=null;
   }
  }catch(e){val=null}
  if(val!==null){
   consts[dest]=val;
   out.push(`${dest} = ${val}   // folded from ${expr}`);
  } else {
   out.push(`${dest} = ${expr}`);
  }
 }
 return {
  encoded:`Constant folding:\n${out.map(l=>'  '+l).join('\n')}\n\nConstants: ${JSON.stringify(consts)}`,
  decoded:`Constant folding evaluates expressions with known operands. Combined with constant propagation and DCE, it eliminates a lot of code.`
 };
}

/* 7 CSE */
function demoCse(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const table={};
 const out=[];
 for(const line of lines){
  const m=line.match(/^\s*([A-Za-z_]\w*)\s*=\s*(.+)$/);
  if(!m){out.push(line);continue}
  const dest=m[1];
  const expr=m[2].trim();
  if(table[expr]!==undefined){
   out.push(`${dest} = ${table[expr]}   // CSE with ${expr}`);
  } else {
   table[expr]=dest;
   out.push(line);
  }
 }
 return {
  encoded:`CSE result:\n${out.map(l=>'  '+l).join('\n')}\n\nExpression table: ${JSON.stringify(table)}`,
  decoded:`Common-subexpression elimination replaces repeated computations with a reference to the first result. GVN generalizes this globally.`
 };
}

/* 9 Register allocation */
function demoRegAlloc(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: one line per variable "name: start end", last line K registers.');
 const K=parseInt(lines[lines.length-1])||3;
 const intervals=[];
 for(let i=0;i<lines.length-1;i++){
  const m=lines[i].match(/^\s*([A-Za-z_]\w*):\s*(\d+)\s+(\d+)/);
  if(m)intervals.push({name:m[1],start:+m[2],end:+m[3]});
 }
 intervals.sort((a,b)=>a.start-b.start);
 const active=[];
 const assign={};
 const free=[...Array(K).keys()];
 const spill=[];
 for(const iv of intervals){
  // Expire
  for(let i=active.length-1;i>=0;i--){
   if(active[i].end<=iv.start){
    free.push(active[i].reg);
    active.splice(i,1);
   }
  }
  free.sort((a,b)=>a-b);
  if(free.length){
   const r=free.shift();
   assign[iv.name]=r;
   active.push({...iv,reg:r});
  } else {
   // Spill the one with furthest end
   let furthest=active[0];
   for(const a of active)if(a.end>furthest.end)furthest=a;
   if(furthest.end>iv.end){
    assign[furthest.name]=null;
    spill.push(furthest.name);
    active.splice(active.indexOf(furthest),1);
    const r=furthest.reg;
    assign[iv.name]=r;
    active.push({...iv,reg:r});
   } else {
    assign[iv.name]=null;
    spill.push(iv.name);
   }
  }
 }
 const lines2=intervals.map(iv=>`  ${iv.name}: [${iv.start}, ${iv.end}] -> ${assign[iv.name]!==null&&assign[iv.name]!==undefined?`R${assign[iv.name]}`:'SPILL'}`);
 return {
  encoded:`Intervals:\n${lines2.join('\n')}\n\nRegisters: ${K}\nSpilled: ${spill.length?spill.join(', '):'(none)'}\n\nAssignments: ${JSON.stringify(assign)}`,
  decoded:`Linear scan allocation sorts intervals by start, expires old ones, and assigns free registers. If none are free, it spills the interval with the furthest end.`
 };
}

/* 10 Taint */
function demoTaint(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const tainted=new Set();
 const sources=new Set(['input','read_input','getenv','argv']);
 const sanitizers=new Set(['sanitize','escape','quote','htmlspecialchars']);
 const sinks=new Set(['execute','exec','query','system','eval','printf']);
 const vulns=[];
 for(const line of lines){
  const m=line.match(/^\s*([A-Za-z_]\w*)\s*=\s*(.+)$/);
  if(m){
   const dest=m[1];
   const expr=m[2];
   // Check if RHS contains a source
   let isTainted=false;
   for(const src of sources){
    if(expr.includes(src)){isTainted=true;break}
   }
   // Check if RHS uses a tainted variable
   for(const v of tainted)if(expr.includes(v)){isTainted=true;break}
   // Sanitizers clear taint
   for(const s of sanitizers)if(expr.includes(s)){isTainted=false;break}
   if(isTainted)tainted.add(dest);
  } else {
   // Check for sink calls
   for(const sink of sinks){
    if(line.includes(sink+'(')||line.includes(sink+' ')){
     for(const v of tainted)if(line.includes(v)){vulns.push(`Tainted '${v}' reaches sink '${sink}' in: ${line.trim()}`)}
    }
   }
  }
 }
 return {
  encoded:`Tainted variables: ${[...tainted].join(', ')||'(none)'}\n\nVulnerabilities (${vulns.length}):\n${vulns.length?vulns.map(v=>'  '+v).join('\n'):'  (none)'}`,
  decoded:`Taint analysis tracks data from sources (input) to sinks (execute, query). A sanitizer removes the taint. A tainted value reaching a sink is a potential vulnerability.`
 };
}

/* 10 Symbolic execution */
function demoSymbolicExec(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 // Very simplified: collect path conditions
 const paths=[[]];
 for(const line of lines){
  const t=line.trim();
  const mIf=t.match(/^if\s+(.+?):$/);
  if(mIf){
   const cond=mIf[1];
   const newPaths=[];
   for(const p of paths){
    newPaths.push([...p,cond]);
    newPaths.push([...p,`not (${cond})`]);
   }
   paths.length=0;
   paths.push(...newPaths);
  } else if(/^assert\s+(.+)$/.test(t)){
   const m=t.match(/^assert\s+(.+)$/);
   const assertion=m[1];
   const results=paths.map(p=>{
    const conds=p.join(' and ');
    return {conds, assertion};
   });
   return {
    encoded:`Symbolic execution:\n\nPaths (${results.length}):\n${results.map((r,i)=>`  Path ${i+1}: ${r.conds}\n    Assert: ${r.assertion}`).join('\n')}\n\nNote: solving each path condition with an SMT solver would confirm or refute the assertion.`,
    decoded:`Symbolic execution forks at each branch. Each path collects a path condition. An SMT solver checks whether the assertion holds on each path.`
   };
  }
 }
 return {
  encoded:`No assert found. ${paths.length} path(s) so far.`,
  decoded:`Symbolic execution forks at branches. Add an assert to see the path conditions.`
 };
}

/* 11 Hoare logic */
function demoHoare(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<4)throw Error('Enter: pre, invariant, body lines, post.');
 // Format: pre; invariant; body...; post
 const pre=lines[0];
 const invariant=lines[1];
 const post=lines[lines.length-1];
 const body=lines.slice(2,-1);
 const checks=[];
 // Parse the sum example
 const isSum=/s\s*=\s*i\s*\*\s*\(\s*i\s*\+\s*1\s*\)\s*\/\s*2/.test(invariant.replace(/\s+/g,''));
 const isPost=/s\s*=\s*n\s*\*\s*\(\s*n\s*\+\s*1\s*\)\s*\/\s*2/.test(post.replace(/\s+/g,''));
 if(isSum&&isPost){
  checks.push({name:'pre -> invariant',ok:true});
  checks.push({name:'invariant and i < n -> invariant after body',ok:true,reason:'s + (i+1) = (i+1)(i+2)/2 holds'});
  checks.push({name:'invariant and i >= n -> post',ok:true,reason:'i = n gives the closed form'});
 } else {
  checks.push({name:'pre -> invariant',ok:'unknown'});
  checks.push({name:'invariant preserved',ok:'unknown'});
  checks.push({name:'invariant -> post',ok:'unknown'});
 }
 return {
  encoded:`Precondition: ${pre}\nInvariant: ${invariant}\nBody:\n${body.map(b=>'  '+b).join('\n')}\nPostcondition: ${post}\n\nProof obligations:\n${checks.map(c=>`  ${c.ok===true?'✓':c.ok===false?'✗':'?'} ${c.name}${c.reason?` — ${c.reason}`:''}`).join('\n')}`,
  decoded:`Hoare logic generates proof obligations: pre -> invariant, invariant is preserved by the body, and invariant and exit condition -> post. A proof assistant or SMT solver discharges them.`
 };
}

function demoInstrSelect(text){
 // Parse a simple arithmetic expression like "a + b * c"
 const tokens=text.match(/\d+|[A-Za-z_]\w*|[+\-*/()]/g)||[];
 let pos=0;
 function peek(){return tokens[pos]}
 function consume(){return tokens[pos++]}
 function expr(){
  let left=term();
  while(peek()==='+'||peek()==='-'){
   const op=consume();
   const right=term();
   left={op,left,right};
  }
  return left;
 }
 function term(){
  let left=atom();
  while(peek()==='*'||peek()==='/'){const op=consume();const right=atom();left={op,left,right}}
  return left;
 }
 function atom(){
  if(peek()==='('){consume();const e=expr();consume();return e}
  const t=consume();
  if(/^\d+$/.test(t))return {const:parseInt(t)};
  return {id:t};
 }
 const tree=expr();
 const instrs=[];
 function select(n){
  if(n.const!==undefined)return {reg:`#${n.const}`,cost:0,code:[]};
  if(n.id)return {reg:n.id,cost:0,code:[]};
  const L=select(n.left),R=select(n.right);
  // Try FMA
  if(n.op==='+'&&n.left.op==='*'){
   const M=select(n.left.left),K=select(n.left.right);
   const dest=`t${instrs.length}`;
   instrs.push(`FMA ${dest}, ${M.reg}, ${K.reg}, ${R.reg}`);
   return {reg:dest,cost:3+M.cost+K.cost+R.cost,code:instrs};
  }
  const dest=`t${instrs.length}`;
  const opName={'+':'ADD','-':'SUB','*':'MUL','/':'DIV'}[n.op];
  instrs.push(`${opName} ${dest}, ${L.reg}, ${R.reg}`);
  return {reg:dest,cost:1+L.cost+R.cost,code:instrs};
 }
 const r=select(tree);
 return {
  encoded:`Expression: ${text}\n\nSelected instructions:\n${instrs.map(i=>'  '+i).join('\n')}\n\nResult register: ${r.reg}\nEstimated cost: ${r.cost}`,
  decoded:`Instruction selection matches IR trees against instruction patterns. Fused multiply-add (FMA) computes a*b+c in one instruction.`
 };
}

function demoPeephole(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const out=[];
 for(const line of lines){
  const t=line.trim();
  if(out.length){
   const prev=out[out.length-1];
   // Duplicate load
   if(prev===t&&/^load\s+/.test(t))continue;
   // add r, 0
   if(/^add\s+\w+,\s*0$/.test(t))continue;
   // mul r, 2 -> add r, r
   const mMul=t.match(/^mul\s+(\w+),\s*2$/);
   if(mMul){out[out.length-1]=`add ${mMul[1]}, ${mMul[1]}`;continue}
  }
  out.push(t);
 }
 return {
  encoded:`Peephole optimization:\n\nOriginal:\n${lines.map(l=>'  '+l).join('\n')}\n\nOptimized:\n${out.map(l=>'  '+l).join('\n')}`,
  decoded:`Peephole optimization scans a small window and replaces instruction patterns with cheaper equivalents. It is local but effective.`
 };
}

<footer class="footer"><span>Az Compilers, Automata &amp; Program Analysis Lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZ · COMPILERS AND ANALYSIS TOOLBOOK</div><h1>Understand compilers, automata and program analysis from regex to SMT-based verification.</h1><p>A single-file course covering language-processing foundations, lexing and parsing, syntax trees and semantic analysis, automata and formal languages, intermediate representations, data-flow analysis, compiler optimization, loop and memory optimization, code generation, program analysis and security, and verification and runtime systems. Every lesson has a plain explanation and most have a runnable lab.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Production compiler software is a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Regex-based lexer, Thompson construction (regex → NFA), subset construction (NFA → DFA), DFA minimization by partition refinement, recursive descent parser, Pratt parser with binding powers, AST construction and symbol table, simple type checking, Hindley-Milner type inference with unification, CYK parsing, CFG construction from three-address code, SSA renaming, liveness analysis, constant folding and propagation, common-subexpression elimination, linear-scan register allocation, taint analysis, symbolic execution path conditions, Hoare logic proof obligations, instruction selection with FMA, and peephole optimization.</p></div><div class="mini"><h3>What does not run here</h3><p>Full lexer and parser generators, LR and LALR table construction, Earley parsing, PDA simulation, full SSA construction with phi nodes, dominator computation (Lengauer-Tarjan), SCCP, abstract interpretation with widening, GVN, PRE, LICM, strength reduction, vectorization, alias analysis, escape analysis, graph-coloring register allocation, instruction scheduling, SMT solving, fuzzing, model checking, JIT compilation, garbage collection, or deoptimization. For real work use LLVM, GCC, Clang, ANTLR, Bison, Flex, Z3, KLEE, angr, Dafny, or another vetted tool.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from language-processing foundations to verification and runtime systems.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+(\.\d+)?\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az Compilers, Automata &amp; Program Analysis Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('source-tokens');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'source-tokens');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">Compilers &amp; Analysis Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-compilers-automata-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
